  if (!$('errorsPanel')) return;
  const open = rows.filter(r => !r.resolved_at);
  $('errorsPanel').innerHTML = `<h3>Errors <span class="chip ${open.length ? 'warn' : ''}">${open.length} open</span></h3><p class="lead">Anything that went wrong in the page or on the server, with the last actions and the app's state at that moment, so it can be reproduced.</p>
    ${rows.length ? `<ul class="logl">${rows.slice(0, 20).map(r => `<li style="display:block"><div style="display:flex;justify-content:space-between;gap:8px"><b>#${r.id} ${esc(r.source)}${r.path ? ' · ' + esc(r.path) : ''}</b><time>${esc(r.created_at.slice(5, 16).replace('T', ' '))}</time></div>
      <div>${esc(r.message)}</div>${r.detail ? `<details><summary style="cursor:pointer;color:var(--muted);font-size:12px">Stack</summary><div class="diff">${esc(r.detail).replace(/\n/g, '<br>')}</div></details>` : ''}${contextBlock(r.context)}
      <div style="margin-top:4px">${r.resolved_at ? '<span class="chip lane lane-fast_track">Resolved</span>' : `<button class="btn" data-resolve="${r.id}" style="padding:1px 8px;font-size:12px">Mark resolved</button>`}</div></li>`).join('')}</ul>` : '<div class="note">No errors recorded.</div>'}`;
  $('errorsPanel').querySelectorAll('[data-resolve]').forEach(b => b.onclick = async () => { await fetch(`api/errors/${b.dataset.resolve}/resolved`, { method: 'POST' }); renderErrors(); });
}

// ---------- copilot ----------
const CP_SUGGEST = ['Who are the 10 people GeneralMind should book meetings with at BME?', 'Why is the selected lead scored the way it is?',
  'Which events give us the most fast-track contacts in logistics?', 'Propose a scoring change so logistics providers rank higher',
  'What would you change in the events playbook to find more order-management people?'];
S.cp = (() => { try { return JSON.parse(store.get('cp') || '[]') } catch { return [] } })();
function renderCp(pending = false) {
  const box = $('cpMsgs');
  box.innerHTML = (S.cp.length ? '' : `<div class="note" style="margin:0">Ask about the leads, events, scoring or playbooks. The copilot can look things up and <b>propose</b> changes as new versions; it never changes what's live. A person reviews and activates them.</div><div class="cp-sugg">${CP_SUGGEST.map(q => `<button data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>`)
    + S.cp.map(m => `<div class="cp-msg ${m.role}">${m.role === 'user' ? esc(m.content) : md(m.content)}${m.actions?.length ? `<div class="acts-note">${m.actions.map(a => typeof a === 'string' ? '✓ ' + esc(a) : `✓ ${esc(a.text)}${a.version_id ? ` <button class="btn" data-activate-v="${a.version_id}" style="padding:2px 8px;font-size:12px;margin-left:4px">Activate v${a.version}</button> <button class="btn" data-review-v="${esc(a.kind)}" style="padding:2px 8px;font-size:12px">Review</button>` : ''}`).join('<br>')}</div>` : ''}</div>`).join('')
    + (pending ? '<div class="cp-msg assistant" style="color:var(--muted)">Thinking…</div>' : '');
  box.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { $('cpIn').value = b.dataset.q; $('cpForm').requestSubmit(); });
  box.querySelectorAll('[data-activate-v]').forEach(b => b.onclick = () => activateVersion(+b.dataset.activateV));
  box.querySelectorAll('[data-review-v]').forEach(b => b.onclick = () => {
    const kind = b.dataset.reviewV;
    if (kind === 'scoring') { const v = S.config.scoring.find(x => x.id === +b.previousElementSibling.dataset.activateV); if (v) { S.draft = JSON.parse(v.body); S.draftBase = v.version; } document.querySelector('#tabs [data-view="criteria"]').click(); renderCriteria(); schedulePreview(); }
    else { S.pbView = { ...(S.pbView || {}), [kind]: +b.previousElementSibling.dataset.activateV }; document.querySelector('#tabs [data-view="playbooks"]').click(); renderPlaybooks(); }
  });
  box.scrollTop = box.scrollHeight;
}
async function loadModels() {
  try {
    const out = await (await fetch('api/copilot/models')).json();
    const sel = $('cpModel');
    if (!out.configured) { sel.innerHTML = '<option>No OpenRouter key yet (Settings)</option>'; sel.disabled = true; return; }
    const list = out.models.length ? out.models : [{ id: out.current, name: out.current, price: '' }];
    sel.innerHTML = list.map(m => `<option value="${esc(m.id)}" ${m.id === out.current ? 'selected' : ''}>${esc(m.name)}${m.price ? ' · ' + esc(m.price) : ''}</option>`).join('');
    sel.disabled = S.data?.meta?.role !== 'owner';
    sel.title = sel.disabled ? 'The owner chooses the model in Settings' : 'Model (via OpenRouter)';
    sel.onchange = async () => { const r = await fetch('api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: 'copilot_model', value: sel.value }) }); toast(r.ok ? 'Model saved for everyone' : 'Only the owner can change the model'); };
  } catch { $('cpModel').innerHTML = '<option>Models unavailable</option>'; }
}
$('cpForm').onsubmit = async e => {
  e.preventDefault();
  const q = $('cpIn').value.trim(); if (!q) return;
  $('cpIn').value = '';
  S.cp.push({ role: 'user', content: q }); renderCp(true);
  const sel = { contact: S.contacts.find(c => c.id === S.sel)?.name, contact_id: S.sel, status_tab: S.status, going_to: S.data ? goingIds() : [] };
  const res = await fetch('api/copilot', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: S.cp.map(({ role, content }) => ({ role, content })).slice(-20), context: { view: S.view, ...sel }, author: S.reviewer || null }) });
  const out = await res.json().catch(() => ({}));
  S.cp.push(res.ok ? { role: 'assistant', content: out.reply, actions: out.actions } : { role: 'assistant', content: `Sorry, that didn't work: ${out.detail || 'server error'}` });
  store.set('cp', JSON.stringify(S.cp.slice(-30)));
  renderCp();
  if (out.actions?.length) { const r = await fetch('api/config'); S.config = await r.json(); renderCriteria(); renderPlaybooks(); }
};
$('cpIn').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('cpForm').requestSubmit(); } });
$('cpBtn').onclick = () => { $('cp').classList.add('open'); renderCp(); loadModels(); $('cpIn').focus(); };
$('cpClose').onclick = () => $('cp').classList.remove('open');
$('cpClear').onclick = () => { S.cp = []; store.set('cp', '[]'); renderCp(); };

// ---------- wiring ----------
const OLD_VIEWS = { queue: 'events', accounts: 'events', hubspot: 'settings' };
function showView(name, push = true) {
  S.view = OLD_VIEWS[name] || name;
  if (!$(`v-${S.view}`)) S.view = 'events';
  syncHash(push);
  $('tabs').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.view === S.view));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === `v-${S.view}`));
  if (S.view === 'settings') renderSettings();
  if (S.view === 'events') renderEvents();
  if (S.view === 'people') renderPeople();
  if (S.view === 'feedback') renderFeedbackTab();
  store.set('view', S.view);
}
window.addEventListener('popstate', () => { const v = applyHash(); if (v && S.data) showView(v, false); });
$('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { if (b.dataset.view === 'events') S.eventId = null; showView(b.dataset.view); });
['q', 'fFunction', 'fSort', 'fSuggest', 'fOther'].forEach(id => $(id).addEventListener('input', renderPeople));
$('whoBtn').onclick = () => { store.set('reviewerAsked', ''); askReviewer(); };
const initialView = applyHash();
load().then(() => showView(initialView || store.get('view') || 'events', false))
  .catch(err => { document.querySelector('main').innerHTML = `<div class="empty">Could not load data: ${esc(err.message)}</div>`; });
</script>
</body>
