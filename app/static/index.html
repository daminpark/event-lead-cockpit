// Before sending: what HubSpot already has for each approved person shown, one answer per person (all their listings, as the
// send merges them). A failed check never blocks anything: the line says so, it's asked again on a later look, and the
// send checks again itself.
const peopleShown = () => S.view === 'people' || (S.view === 'events' && !!S.eventId);
async function checkHubspot(rows) {
  if (Date.now() - S.hsFailedAt < 15000) return;
  const want = rows.filter(c => !(c.person_key in S.hsFound) && !S.hsChecking.has(c.person_key)).slice(0, 200);
  if (!want.length) return;
  const keys = [...new Set(want.map(c => c.person_key))];
  keys.forEach(k => S.hsChecking.add(k));
  let out = null;
  try { const r = await fetch('api/hubspot/lookup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contact_ids: want.map(c => c.id) }) }); if (r.ok) out = await r.json(); } catch {}
  keys.forEach(k => { S.hsChecking.delete(k); if (out) S.hsFound[k] = out[k] || null; });
  S.hsFailedAt = out ? 0 : Date.now();
  if (peopleShown()) renderPeople();
}
const STAGES = { marketingqualifiedlead: 'MQL', salesqualifiedlead: 'SQL' };
function hsLine(c) {
  const f = S.hsFound[c.person_key];
  if (f === undefined) return S.hsChecking.has(c.person_key) ? '<div class="hs-line">Checking HubSpot…</div>' : S.hsFailedAt ? `<div class="hs-line">Couldn't check HubSpot</div>` : '';
  if (!f || (!f.contact && !f.possible && S.hs.has(hsKey(c)))) return '';  // sent from another event: the row says so
  const about = rec => [STAGES[rec.stage] || rec.stage, rec.owner && `owner ${rec.owner}`].filter(Boolean).map(esc).join(' · ');
  const open = (kind, id) => { const u = hubspotUrl(kind, id); return u ? ` · <a href="${esc(u)}" target="_blank" rel="noopener">Open ↗</a>` : ''; };
  if (f.possible) {  // not linked: a person confirms whether it's the same (the AI's suggestion and a confirm button go here)
    const p = f.possible, what = p.kind === 'account' ? `company ${esc(p.name || '')} (${p.domain ? esc(p.domain) : 'no domain'})${about(p) ? `, ${about(p)}` : ''}` : `${esc(c.name)} at another company`;
    return `<div class="hs-line">Possible match in HubSpot: ${what}${open(p.kind, p.id)} · Not sent until someone confirms it's the same</div>`;
  }
  const rec = f.contact || f.company;
  if (!rec) return '<div class="hs-line">New to HubSpot</div>';
  return `<div class="hs-line">${f.contact ? 'Already in HubSpot' : 'New contact; company in HubSpot'}${about(rec) ? `: ${about(rec)}` : ''}${open(f.contact ? 'contact' : 'account', rec.id)}</div>`;
}
// What Send will do with the selection, per person: records to create, existing ones that only get the GM fields, and possible matches it leaves.
function sendPlan() {
  const keys = [...new Set([...S.pushSel].map(id => S.contacts.find(c => c.id === id)?.person_key).filter(Boolean))];
  if (!keys.length) return '';
  if (keys.some(k => S.hsChecking.has(k))) return 'Checking HubSpot…';
  if (keys.some(k => !(k in S.hsFound))) return "Couldn't check HubSpot";
  const seen = new Set(), n = { new: 0, old: 0, held: 0 };
  const count = (k, there) => { if (!seen.has(k)) { seen.add(k); n[there ? 'old' : 'new']++; } };
  keys.forEach(k => {
    const f = S.hsFound[k];
    if (!f) return;
    if (f.possible) { n.held++; return; }
    count(key('contact', k), f.contact || S.hs.has(key('contact', k)));
    if (f.account_id) count(key('account', f.account_id), f.company || S.hs.has(key('account', f.account_id)));
  });
  return `${n.new} to create · ${n.old} already in HubSpot (GM fields only)${n.held ? ` · ${n.held} possible ${n.held === 1 ? 'match' : 'matches'} not sent` : ''}`;
}

function md(src) {
  const lines = esc(src).split('\n'), out = []; let list = null;
  const inline = s => s.replace(/\[([^\]]+)\]\((#\/[^)\s]+|https?:\/\/[^)\s]+)\)/g, (m, t, u) => `<a href="${u}"${u.startsWith('http') ? ' target="_blank" rel="noopener"' : ''}>${t}</a>`)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>');
  for (const l of lines) {
    const li = l.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
    if (li) { if (!list) { list = l.trim().match(/^\d/) ? 'ol' : 'ul'; out.push(`<${list}>`); } out.push(`<li>${inline(li[1])}</li>`); continue; }
    if (list) { out.push(`</${list}>`); list = null; }
    if (/^# /.test(l)) out.push(`<h1>${inline(l.slice(2))}</h1>`);
    else if (/^## /.test(l)) out.push(`<h2>${inline(l.slice(3))}</h2>`);
    else if (l.trim()) out.push(`<p>${inline(l)}</p>`);
  }
  if (list) out.push(`</${list}>`);
  return out.join('');
}

// Line diff (longest common subsequence): ' ' same, '-' removed, '+' added.
function lineDiff(a, b) {
  const A = a.replace(/\n$/, '').split('\n'), B = b.replace(/\n$/, '').split('\n'), n = A.length, m = B.length;
  const dp = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) { if (A[i] === B[j]) { out.push([' ', A[i]]); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) out.push(['-', A[i++]]); else out.push(['+', B[j++]]); }
  while (i < n) out.push(['-', A[i++]]);

function diffHtml(d, oldLabel = 'Before', newLabel = 'After') {
  if (!d.some(([t]) => t !== ' ')) return '<div class="note">No differences.</div>';
  const rows = [];
  for (let i = 0; i < d.length;) {
    if (d[i][0] === ' ') { rows.push([d[i][1], d[i][1], false]); i++; continue; }
    const del = [], add = [];
    while (i < d.length && d[i][0] !== ' ') (d[i][0] === '-' ? del : add).push(d[i++][1]);
    for (let k = 0; k < Math.max(del.length, add.length); k++) rows.push([del[k] ?? null, add[k] ?? null, true]);
  }
  const keep = new Set();  // changed lines with two lines of context around them
  rows.forEach(([, , chg], i) => { if (chg) for (let k = i - 2; k <= i + 2; k++) keep.add(k); });
  const cell = (l, side, cls) => `<div class="sl ${side} ${l === null ? 'empty' : cls}">${l === null ? '' : esc(l) || '&nbsp;'}</div>`;
  let html = `<div class="sh l">${esc(oldLabel)}</div><div class="sh r">${esc(newLabel)}</div>`, skipped = 0;
  const skip = () => { if (skipped) html += `<div class="sl skip">⋯ ${skipped} unchanged line${skipped > 1 ? 's' : ''}</div>`; skipped = 0; };
  rows.forEach(([a, b, chg], i) => {
    if (!keep.has(i)) { skipped++; return; }
    skip();
    html += cell(a, 'l', chg ? 'del' : '') + cell(b, 'r', chg ? 'add' : '');
  });
  skip();
  return `<div class="diffview sbs">${html}</div>`;
}

    const cls = [...el.classList].filter(c => !['sel', 'fb-hover', 'on', 'done'].includes(c)).slice(0, 2);
    if (cls.length) p += '.' + cls.join('.');

$('fbBtn').onclick = e => { e.stopPropagation(); picking ? (stopPick(), picked = null, openFeedback()) : startPick(); };
$('hsPill').onclick = () => showView('settings');

// ---------- settings ----------
async function renderSettings() {
  const st = await (await fetch('api/settings')).json().catch(() => null);
  if (!st) return;
  const owner = st.role === 'owner';
  const conn = (name, title, help, placeholder) => {
    const c = st[name], ok = c.health?.ok;
    return `<div class="panel">
      <h3><i class="dot ${c.set ? (ok ? 'ok' : 'bad') : ''}"></i>&nbsp; ${title}</h3>
      <p class="lead">${help}</p>
      <dl class="kv"><dt>Status</dt><dd>${c.set ? `Key saved ${c.hint ? `(ends ${esc(c.hint)})` : ''}, ${c.source === 'cockpit' ? 'set here' : 'set on the server'}${c.health ? ` · <b style="color:${c.health.ok ? 'var(--fast)' : 'var(--competitor)'}">${esc(c.health.detail)}</b>` : ''}` : 'Not set'}</dd></dl>
      ${owner ? `<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><input type="password" autocomplete="off" data-secret="${name}" placeholder="${placeholder}" style="flex:1;min-width:220px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);color:var(--ink)">
        <button class="btn primary" data-save-secret="${name}">Save</button>${c.source === 'cockpit' ? `<button class="btn" data-remove-secret="${name}">Remove</button>` : ''}</div><div class="err" id="err-${name}"></div>`
      : '<div class="note">Only the owner can change keys.</div>'}
    </div>`;
  };
  $('settingsView').innerHTML = `
    <div class="panel"><h3>Settings</h3><p class="lead">You're signed in as <b>${owner ? 'owner' : 'team member'}</b>. ${owner ? 'You can manage the connections below. Keys are stored on the server and never shown again in full.' : 'The owner manages connections and the copilot model; everything else in the cockpit is yours to use.'}</p></div>
    <div class="grid2">
      ${conn('hubspot', 'HubSpot', 'A service key lets the cockpit create and update companies and contacts. In HubSpot: Settings → Integrations → Service Keys → create a key with read and write access to contacts and companies and their properties, then copy it. Tokens from older private apps still work.', 'pat-…')}
      ${conn('openrouter', 'OpenRouter (copilot)', 'The copilot talks to AI models through OpenRouter, so the model can be changed below without touching code. Create a key at openrouter.ai → Keys, ideally with a monthly credit limit.', 'sk-or-…')}
    </div>
    <div id="exportView"></div>
    <div class="panel"><h3>Copilot model</h3><p class="lead">Applies to everyone. Prices are per million tokens in / out. Only models that can use tools are listed, since the copilot looks things up.</p>
      <input type="search" id="modelFilter" placeholder="Filter models, e.g. kimi, claude, gemini" ${owner ? '' : 'disabled'} style="width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);color:var(--ink);margin-bottom:8px">
      <select id="setModel" size="10" ${owner ? '' : 'disabled'} style="width:100%;font:inherit;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);color:var(--ink)"><option>Loading…</option></select>
      <div id="modelNow" style="color:var(--muted);font-size:12.5px;margin-top:6px"></div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:12px"><b style="font-size:13px">Thinking effort</b>
        <select id="setEffort" ${owner ? '' : 'disabled'} style="font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);color:var(--ink)">${['low', 'medium', 'high'].map(e => `<option ${e === st.copilot_effort ? 'selected' : ''}>${e}</option>`).join('')}</select>
        <span style="color:var(--muted);font-size:12.5px">Higher is a little smarter but much slower and costlier. Medium suits the copilot.</span></div></div>
    <div class="panel"><h3>You</h3><p class="lead">Your name is saved with your decisions and notes.</p><button class="btn" id="setWho">Reviewer: ${esc(S.reviewer || 'not set')}</button> <a class="btn" href="logout">Sign out (to use another code)</a></div>`;
  renderExport();
  const root = $('settingsView');
  root.querySelectorAll('[data-save-secret]').forEach(b => b.onclick = () => saveSecret(b.dataset.saveSecret, root.querySelector(`[data-secret="${b.dataset.saveSecret}"]`).value));
  root.querySelectorAll('[data-remove-secret]').forEach(b => b.onclick = () => { if (confirm('Remove this key?')) saveSecret(b.dataset.removeSecret, ''); });
  $('setEffort').onchange = async e => {
    const r = await fetch('api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: 'copilot_effort', value: e.target.value }) });
    toast(r.ok ? `Thinking effort set to ${e.target.value}` : 'Only the owner can change this');
  };
  $('setWho').onclick = async () => { store.set('reviewerAsked', ''); await askReviewer(); renderSettings(); };
  try {
    const m = await (await fetch('api/copilot/models')).json();
    const sel = $('setModel');
    if (!m.configured) { sel.innerHTML = '<option>Add an OpenRouter key first</option>'; sel.disabled = true; return; }
    const SUGGESTED = ['openai/gpt-6.1-sol', 'deepseek/deepseek-v4.1-flash', 'anthropic/claude-sonnet-5.5', 'google/gemini-4-argon', 'moonshotai/kimi-k3.1-pro'];
    const opt = x => `<option value="${esc(x.id)}" ${x.id === m.current ? 'selected' : ''}>${esc(x.name)} · ${esc(x.price)}</option>`;
    const draw = (q = '') => {
      const match = x => !q || `${x.id} ${x.name}`.toLowerCase().includes(q.toLowerCase());
      const sugg = SUGGESTED.map(id => m.models.find(x => x.id === id)).filter(Boolean).filter(match);
      const rest = m.models.filter(x => !x.id.endsWith(':batch') && !SUGGESTED.includes(x.id)).filter(match);
      sel.innerHTML = (sugg.length ? `<optgroup label="Suggested">${sugg.map(opt).join('')}</optgroup>` : '') + `<optgroup label="All models (${rest.length})">${rest.map(opt).join('')}</optgroup>`;
    };
    draw();
    const now = m.models.find(x => x.id === m.current);
    $('modelNow').textContent = now ? `In use: ${now.name} (${now.price})` : `In use: ${m.current}`;
    $('modelFilter').oninput = e => draw(e.target.value);
    sel.onchange = async () => {
      const r = await fetch('api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: 'copilot_model', value: sel.value }) });
      toast(r.ok ? 'Model saved for everyone' : 'Only the owner can change the model');
      if (r.ok) { const x = m.models.find(y => y.id === sel.value); m.current = sel.value; $('modelNow').textContent = `In use: ${x?.name || sel.value} (${x?.price || ''})`; }
    };
  } catch { $('setModel').innerHTML = '<option>Models unavailable</option>'; }
}

async function saveSecret(name, value) {
  if (value) toast('Checking the key…');
  const res = await fetch('api/settings/secret', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, value }) });
  const out = await res.json().catch(() => ({}));
  if (!res.ok) { $(`err-${name}`).textContent = out.detail || 'Could not save'; return; }
  toast(value ? 'Saved' : 'Removed');
  await refreshHubspot(); renderSettings();
}

// ---------- errors and context ----------
function contextBlock(raw) {
  if (!raw) return '';
  let c; try { c = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch { return ''; }
  const st = c.state || {};
  return `<details style="margin-top:4px"><summary style="cursor:pointer;color:var(--muted);font-size:12px">What was happening</summary>
    <div class="diff" style="max-height:220px">${(c.trail || []).map(t => `${esc(t.t)} ${esc(t.type)}: ${esc(t.detail)}`).join('<br>') || 'No actions recorded'}
    <br><br>view ${esc(st.view)} · contact ${esc(st.contact || '—')} · scoring v${esc(st.scoring_version)} · build ${esc(st.app_version)} · ${esc(st.viewport)} · ${esc(st.role || '')}</div></details>`;
}

async function renderErrors() {
  const rows = await (await fetch('api/errors')).json().catch(() => []);
  if (!$('errorsPanel')) return;
  const open = rows.filter(r => !r.resolved_at);
  $('errorsPanel').innerHTML = `<h3>Errors <span class="chip ${open.length ? 'warn' : ''}">${open.length} open</span></h3><p class="lead">Anything that went wrong in the page or on the server, with the last actions and the app's state at that moment, so it can be reproduced.</p>
    ${rows.length ? `<ul class="logl">${rows.slice(0, 20).map(r => `<li style="display:block"><div style="display:flex;justify-content:space-between;gap:8px"><b>#${r.id} ${esc(r.source)}${r.path ? ' · ' + esc(r.path) : ''}</b><time>${esc(r.created_at.slice(5, 16).replace('T', ' '))}</time></div>
      <div>${esc(r.message)}</div>${r.detail ? `<details><summary style="cursor:pointer;color:var(--muted);font-size:12px">Stack</summary><div class="diff">${esc(r.detail).replace(/\n/g, '<br>')}</div></details>` : ''}${contextBlock(r.context)}
      <div style="margin-top:4px">${r.resolved_at ? '<span class="chip lane lane-fast_track">Resolved</span>' : `<button class="btn" data-resolve="${r.id}" style="padding:1px 8px;font-size:12px">Mark resolved</button>`}</div></li>`).join('')}</ul>` : '<div class="note">No errors recorded.</div>'}`;
  $('errorsPanel').querySelectorAll('[data-resolve]').forEach(b => b.onclick = async () => { await fetch(`api/errors/${b.dataset.resolve}/resolved`, { method: 'POST' }); renderErrors(); });
}

// ---------- copilot ----------
const CP_SUGGEST = ['Who should we meet first at the BME-Symposium?', 'Show me the people approved at BME', 'Why is the selected person scored the way they are?',
  'Which events are we going to, and how many people are approved there?', 'Make speakers count a bit more in the score', 'How do I send people to HubSpot?'];
S.cp = (() => { try { return JSON.parse(store.get('cp') || '[]') } catch { return [] } })();
function renderCp(pending = false) {
  const box = $('cpMsgs');
  box.innerHTML = (S.cp.length ? '' : `<div class="note" style="margin:0">Ask about events, people, scores and statuses, or how the cockpit works. It answers from the cockpit's data, links you to the right page, can <b>propose</b> small scoring changes (you activate them) and write down feedback. Approving people, choosing events and sending to HubSpot stay with you.</div><div class="cp-sugg">${CP_SUGGEST.map(q => `<button data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>`)
    + S.cp.map(m => `<div class="cp-msg ${m.role}">${m.role === 'user' ? esc(m.content) : md(m.content)}${m.actions?.length ? `<div class="acts-note">${m.actions.map(a => typeof a === 'string' ? '✓ ' + esc(a) : `✓ ${esc(a.text)}${a.version_id ? ` <button class="btn" data-activate-v="${a.version_id}" style="padding:2px 8px;font-size:12px;margin-left:4px">Activate v${a.version}</button> <button class="btn" data-review-v="${esc(a.kind)}" style="padding:2px 8px;font-size:12px">Review</button>` : ''}`).join('<br>')}</div>` : ''}</div>`).join('')
    + (pending ? '<div class="cp-msg assistant" style="color:var(--muted)">Thinking…</div>' : '');
  box.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { $('cpIn').value = b.dataset.q; $('cpForm').requestSubmit(); });
  box.querySelectorAll('[data-activate-v]').forEach(b => b.onclick = () => activateVersion(+b.dataset.activateV));
  box.querySelectorAll('a[href^="#/"]').forEach(a => a.onclick = e => {  // the assistant's links open the page here
    e.preventDefault(); history.pushState(null, '', a.getAttribute('href'));
    const v = applyHash(); if (v) showView(v, false);
    if (innerWidth < 1100) $('cp').classList.remove('open');
  });
  box.querySelectorAll('[data-review-v]').forEach(b => b.onclick = () => {
    const kind = b.dataset.reviewV;
    if (kind === 'scoring') { const v = S.config.scoring.find(x => x.id === +b.previousElementSibling.dataset.activateV); if (v) { S.draft = JSON.parse(v.body); S.draftBase = v.version; } showView('criteria'); renderCriteria(); schedulePreview(); }
    else { S.pbKind = kind.split(':')[1]; const st = pbState(S.pbKind); st.compareId = +b.previousElementSibling.dataset.activateV; st.tab = 'changes'; showView('playbooks'); }
  });
  box.scrollTop = box.scrollHeight;
}
async function loadModels() {
  try {
    const out = await (await fetch('api/copilot/models')).json();
    const sel = $('cpModel');
    if (!out.configured) { sel.innerHTML = '<option>No OpenRouter key yet (Settings)</option>'; sel.disabled = true; return; }
    const list = out.models.length ? out.models : [{ id: out.current, name: out.current, price: '' }];
    sel.innerHTML = list.map(m => `<option value="${esc(m.id)}" ${m.id === out.current ? 'selected' : ''}>${esc(m.name)}${m.price ? ' · ' + esc(m.price) : ''}</option>`).join('');
    sel.disabled = S.data?.meta?.role !== 'owner';
    sel.title = sel.disabled ? 'The owner chooses the model in Settings' : 'Model (via OpenRouter)';
    sel.onchange = async () => { const r = await fetch('api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: 'copilot_model', value: sel.value }) }); toast(r.ok ? 'Model saved for everyone' : 'Only the owner can change the model'); };
  } catch { $('cpModel').innerHTML = '<option>Models unavailable</option>'; }
}
$('cpForm').onsubmit = async e => {
  e.preventDefault();
  const q = $('cpIn').value.trim(); if (!q) return;
  $('cpIn').value = '';
  S.cp.push({ role: 'user', content: q }); renderCp(true);
  const sel = { page: S.view, event_id: S.view === 'events' ? S.eventId : null, selected_person_id: S.sel, selected_person: S.contacts.find(c => c.id === S.sel)?.name, status_tab: S.status };
  const res = await fetch('api/copilot', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: S.cp.map(({ role, content }) => ({ role, content })).slice(-20), context: { view: S.view, ...sel }, author: S.reviewer || null }) });
  const out = await res.json().catch(() => ({}));
  S.cp.push(res.ok ? { role: 'assistant', content: out.reply, actions: out.actions } : { role: 'assistant', content: `Sorry, that didn't work: ${out.detail || 'server error'}` });
  store.set('cp', JSON.stringify(S.cp.slice(-30)));
  renderCp();
  if (out.actions?.length) { const r = await fetch('api/config'); S.config = await r.json(); renderCriteria(); }
};
$('cpIn').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('cpForm').requestSubmit(); } });
$('cpBtn').onclick = () => { $('cp').classList.add('open'); renderCp(); loadModels(); $('cpIn').focus(); };
$('cpClose').onclick = () => $('cp').classList.remove('open');
$('cpClear').onclick = () => { S.cp = []; store.set('cp', '[]'); renderCp(); };

// ---------- wiring ----------
const OLD_VIEWS = { queue: 'events', accounts: 'events', hubspot: 'settings', insights: 'events', about: 'events' };
function showView(name, push = true) {
  S.view = OLD_VIEWS[name] || name;
  if (!$(`v-${S.view}`)) S.view = 'events';
  syncHash(push);
  $('tabs').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.view === (S.view === 'criteria' ? 'playbooks' : S.view)));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === `v-${S.view}`));
  if (S.view === 'settings') renderSettings();
  if (S.view === 'events') renderEvents();
  if (S.view === 'people') renderPeople();
  if (S.view === 'feedback') renderFeedbackTab();
  if (S.view === 'playbooks') renderPlaybooks();
  store.set('view', S.view);
}
window.addEventListener('popstate', () => { const v = applyHash(); if (v && S.data) showView(v, false); });
$('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { if (b.dataset.view === 'events') S.eventId = null; if (b.dataset.view === 'playbooks') S.pbKind = null; showView(b.dataset.view); });
['q', 'fFunction', 'fSort', 'fSuggest', 'fOther'].forEach(id => $(id).addEventListener('input', renderPeople));
$('whoBtn').onclick = () => { store.set('reviewerAsked', ''); askReviewer(); };
const initialView = applyHash();
load().then(() => showView(initialView || store.get('view') || 'events', false))
  .catch(err => { document.querySelector('main').innerHTML = `<div class="empty">Could not load data: ${esc(err.message)}</div>`; });
</script>
