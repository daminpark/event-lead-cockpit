<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Lead Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --panel-2: #fafaf8; --ink: #1b1c1f; --muted: #6a6e76; --faint: #9a9ea6;
  --line: #e5e5e1; --line-2: #efefec; --accent: #2f4fd8; --accent-soft: #e9edfd;
  --fast: #1d7f48; --fast-soft: #e3f3e9; --review: #a86a0c; --review-soft: #fbf0dc;
  --filtered: #7b8089; --filtered-soft: #eeeff1; --partner: #6a43b8; --partner-soft: #efe9fa;
  --competitor: #bf2f2f; --competitor-soft: #fbe7e7; --customer: #1f6aa8; --customer-soft: #e3eff9;
  --shadow: 0 1px 2px rgba(20,20,30,.05), 0 4px 16px rgba(20,20,30,.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131416; --panel: #1b1c1f; --panel-2: #202125; --ink: #ececee; --muted: #a0a4ab; --faint: #73777e;
    --line: #2c2e33; --line-2: #25272b; --accent: #7d95ff; --accent-soft: #232a45;
    --fast: #4cc483; --fast-soft: #173325; --review: #e0a542; --review-soft: #352a15;
    --filtered: #9a9fa8; --filtered-soft: #26282c; --partner: #a98af0; --partner-soft: #2b2340;
    --competitor: #f07575; --competitor-soft: #3a1f1f; --customer: #6db3ef; --customer-soft: #19293a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131416; --panel: #1b1c1f; --panel-2: #202125; --ink: #ececee; --muted: #a0a4ab; --faint: #73777e;
  --line: #2c2e33; --line-2: #25272b; --accent: #7d95ff; --accent-soft: #232a45;
  --fast: #4cc483; --fast-soft: #173325; --review: #e0a542; --review-soft: #352a15;
  --filtered: #9a9fa8; --filtered-soft: #26282c; --partner: #a98af0; --partner-soft: #2b2340;
  --competitor: #f07575; --competitor-soft: #3a1f1f; --customer: #6db3ef; --customer-soft: #19293a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }

header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.brand { display: flex; flex-direction: column; }
.brand b { font-size: 15px; letter-spacing: -.01em; }
.brand span { color: var(--muted); font-size: 12px; }
nav { display: flex; gap: 2px; margin-left: 12px; overflow-x: auto; scrollbar-width: none; }
nav button { border: 0; background: none; padding: 7px 11px; border-radius: 7px; color: var(--muted); font-weight: 500; white-space: nowrap; }
nav button:hover { background: var(--line-2); color: var(--ink); }
nav button.on { background: var(--accent-soft); color: var(--accent); }
.who { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; white-space: nowrap; }
.who button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 4px 10px; font-size: 12px; }

main { padding: 20px 24px 60px; max-width: 1440px; margin: 0 auto; }
.view { display: none; }
.view.on { display: block; }

.stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; text-align: left; transition: border-color .15s, box-shadow .15s; }
.stat:hover { border-color: var(--faint); }
.stat.on { border-color: var(--k, var(--accent)); box-shadow: inset 0 0 0 1px var(--k, var(--accent)); }
.stat .k { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 500; }
.stat .k i { width: 8px; height: 8px; border-radius: 50%; background: var(--k); }
.stat .v { font-size: 22px; font-weight: 600; letter-spacing: -.02em; margin-top: 2px; }
.stat .s { color: var(--faint); font-size: 11.5px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.toolbar select, .toolbar input[type=search] { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.toolbar input[type=search] { flex: 1 1 220px; }
.toolbar label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.toolbar .count { color: var(--muted); font-size: 12.5px; margin-left: auto; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; align-items: start; }
.list { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.row { display: grid; grid-template-columns: 70px minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1.5fr) 92px; gap: 14px; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--line-2); cursor: pointer; }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--panel-2); }
.row.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.row.done { opacity: .62; }
.row .t1 { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .t2 { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.head { cursor: default; background: var(--panel-2); color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; padding-top: 8px; padding-bottom: 8px; }
.head:hover { background: var(--panel-2); }
.score { width: 44px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: var(--ls, var(--filtered-soft)); color: var(--lc, var(--filtered)); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; padding: 1px 7px; font-size: 11.5px; background: var(--line-2); color: var(--muted); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.chip.pts b { color: var(--ink); font-weight: 600; }
.chip.lane { background: var(--ls); color: var(--lc); font-weight: 600; }
.chip.warn { background: var(--review-soft); color: var(--review); }
.acts { display: flex; gap: 6px; justify-content: flex-end; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 10px; font-weight: 500; font-size: 13px; }
.btn:hover { border-color: var(--faint); }
.btn.ok { color: var(--fast); }
.btn.ok:hover, .btn.ok.on { background: var(--fast-soft); border-color: var(--fast); }
.btn.no { color: var(--competitor); }
.btn.no:hover, .btn.no.on { background: var(--competitor-soft); border-color: var(--competitor); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.icon { width: 34px; padding: 5px 0; text-align: center; }
.status { font-size: 12px; font-weight: 600; }
.status.approve { color: var(--fast); }
.status.reject { color: var(--competitor); }
.empty { padding: 40px; text-align: center; color: var(--muted); }

.lane-fast_track { --lc: var(--fast); --ls: var(--fast-soft); --k: var(--fast); }
.lane-review { --lc: var(--review); --ls: var(--review-soft); --k: var(--review); }
.lane-filtered { --lc: var(--filtered); --ls: var(--filtered-soft); --k: var(--filtered); }
.lane-partner { --lc: var(--partner); --ls: var(--partner-soft); --k: var(--partner); }
.lane-competitor { --lc: var(--competitor); --ls: var(--competitor-soft); --k: var(--competitor); }
.lane-customer { --lc: var(--customer); --ls: var(--customer-soft); --k: var(--customer); }
.lane-decided { --k: var(--accent); }

.drawer { position: sticky; top: 76px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; max-height: calc(100vh - 96px); overflow: auto; box-shadow: var(--shadow); }
.drawer .close { display: none; float: right; border: 0; background: var(--line-2); border-radius: 8px; width: 32px; height: 32px; font-size: 18px; line-height: 1; }
.drawer h2 { font-size: 18px; margin: 0 0 2px; letter-spacing: -.01em; }
.drawer .sub { color: var(--muted); margin-bottom: 12px; }
.drawer h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin: 18px 0 8px; }
.bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--line-2); margin: 8px 0 4px; }
.bar span { display: block; height: 100%; }
.legend { display: flex; gap: 12px; color: var(--muted); font-size: 12px; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
.reasons { list-style: none; padding: 0; margin: 0; }
.reasons li { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px dashed var(--line-2); font-size: 13px; }
.reasons li span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; }
.reasons li.zero { color: var(--faint); }
.reasons li.zero span:last-child { font-weight: 400; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.note { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 9px 11px; color: var(--muted); font-size: 12.5px; margin-top: 8px; }
.decide { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.decide .btn { padding: 8px 14px; }
.reject-reasons { display: none; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.reject-reasons.on { display: flex; }
.reject-reasons button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; }
.reject-reasons button:hover { border-color: var(--competitor); color: var(--competitor); }
.kbd { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); }
.hint { color: var(--faint); font-size: 12px; margin-top: 14px; line-height: 1.8; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.card h4 { margin: 0 0 2px; font-size: 15px; letter-spacing: -.01em; }
.card .when { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
.card p { margin: 0 0 10px; color: var(--ink); font-size: 13px; }
.card .nums { display: flex; gap: 16px; margin: 10px 0; }
.card .nums div { font-size: 12px; color: var(--muted); }
.card .nums b { display: block; font-size: 18px; color: var(--ink); font-variant-numeric: tabular-nums; }
.card ul { margin: 0; padding-left: 16px; font-size: 12.5px; color: var(--muted); }
.badge { display: inline-block; background: var(--accent); color: #fff; font-size: 11px; font-weight: 600; border-radius: 5px; padding: 1px 7px; margin-left: 6px; vertical-align: 2px; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; overflow-x: auto; }
.panel h3 { margin: 0 0 4px; font-size: 15px; }
.panel .lead { color: var(--muted); margin: 0 0 14px; font-size: 13px; max-width: 760px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; color: var(--faint); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.t td { padding: 7px 8px; border-bottom: 1px solid var(--line-2); font-variant-numeric: tabular-nums; }
.meter { height: 6px; background: var(--line-2); border-radius: 99px; overflow: hidden; min-width: 60px; }
.meter span { display: block; height: 100%; background: var(--fast); }
.big { font-size: 34px; font-weight: 650; letter-spacing: -.03em; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.prose { max-width: 780px; }
.prose h2 { font-size: 20px; letter-spacing: -.01em; margin: 26px 0 8px; }
.prose h2:first-child { margin-top: 0; }
.prose p, .prose li { font-size: 14px; line-height: 1.6; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
.toast.on { opacity: 1; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); padding: 20px; width: min(380px, calc(100vw - 32px)); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog input { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); color: var(--ink); margin: 10px 0 14px; }

.pill { display: inline-flex; align-items: center; gap: 6px; }
.step { display: flex; gap: 24px; align-items: center; justify-content: space-between; }
.step h3 { margin: 2px 0 4px; font-size: 17px; }
.stepno { color: var(--accent); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.stepside { text-align: right; flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.evlist { display: flex; flex-direction: column; gap: 10px; }
.evrow { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.evrow.going { border-color: var(--fast); box-shadow: inset 4px 0 0 var(--fast); }
.evrow.notgoing { opacity: .6; }
.evmain { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto auto; gap: 16px; align-items: center; padding: 14px 16px; }
.evinfo .t1 { font-weight: 600; font-size: 15px; }
.evinfo .t2 { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.evnums { display: flex; gap: 14px; }
.evnums div { font-size: 11.5px; color: var(--muted); text-align: center; }
.evnums b { display: block; font-size: 18px; color: var(--ink); font-variant-numeric: tabular-nums; }
.evacts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.evmore { border-top: 1px solid var(--line-2); padding: 12px 16px 16px 84px; font-size: 13px; }
.evmore p { margin: 0 0 8px; }
.stabs { display: flex; gap: 4px; margin-bottom: 10px; border-bottom: 1px solid var(--line); }
.stab { border: 0; background: none; padding: 9px 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.stab.on { color: var(--ink); border-bottom-color: var(--accent); }
.stab span { background: var(--line-2); border-radius: 999px; padding: 1px 8px; font-size: 12px; margin-left: 4px; }
.pushbar { background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; }
.fitcell { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.pwrap { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 16px; align-items: start; }
.rail { position: sticky; top: 76px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px; max-height: calc(100vh - 96px); overflow: auto; }
.rail h5 { margin: 10px 8px 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
.railitem { display: block; width: 100%; text-align: left; border: 0; background: none; border-radius: 8px; padding: 8px 10px; }
.railitem:hover { background: var(--panel-2); }
.railitem.on { background: var(--accent-soft); }
.railitem b { display: block; font-size: 13px; line-height: 1.3; }
.railitem small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.railitem .rc { display: flex; gap: 6px; margin-top: 4px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
.railitem .rc span b { display: inline; font-size: 11px; color: var(--ink); }
.railitem.dim { opacity: .55; }
.rscore { flex: 0 0 auto; min-width: 28px; text-align: center; border-radius: 6px; padding: 1px 4px; font-size: 12px; font-weight: 700; background: var(--ls, var(--line-2)); color: var(--lc, var(--muted)); margin-top: 1px; }
.evhead { display: flex; gap: 16px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.evhead h3 { margin: 2px 0; font-size: 17px; }
.evhead .meta { color: var(--muted); font-size: 13px; }
.evhead .acts2 { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.grouphead { display: flex; justify-content: space-between; gap: 12px; padding: 9px 14px; background: var(--panel-2); border-bottom: 1px solid var(--line); font-weight: 600; font-size: 13px; cursor: default; }
.grouphead span { color: var(--muted); font-weight: 500; }
.mobile-only { display: none; }
.evtable { display: grid; grid-template-columns: 52px minmax(0, 2.4fr) 92px 82px 84px 78px 74px 132px 92px; gap: 14px; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--line-2); cursor: pointer; }
.evtable:last-child { border-bottom: 0; }
.evtable:hover { background: var(--panel-2); }
.evtable .sorth { border: 0; background: none; padding: 0; text-align: left; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; white-space: nowrap; }
.evtable .sorth:hover, .evtable .sorth.on { color: var(--ink); }
.plan { font-size: 14px; line-height: 1.8; }
.evgo { display: flex; gap: 4px; }
.evgo .btn { padding: 3px 8px; font-size: 12px; }
.whenbar { display: inline-flex; gap: 4px; background: var(--line-2); border-radius: 10px; padding: 3px; margin-bottom: 10px; }
.whenbar button { border: 0; background: none; padding: 6px 16px; border-radius: 8px; font-weight: 600; color: var(--muted); }
.whenbar button.on { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.whenbar .num { font-weight: 500; color: var(--faint); margin-left: 2px; }
.plan select { font: inherit; padding: 2px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); color: var(--ink); }
.evlistwrap { overflow-x: auto; }
.evtable.head { cursor: default; background: var(--panel-2); color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; padding-top: 8px; padding-bottom: 8px; }
.evtable.notgoing, .evtable.past { opacity: .6; }
.evtable .t1 { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.evtable .t2 small { color: var(--faint); }
.breakdown { display: flex; flex-direction: column; gap: 6px; }
.bk { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(60px, 1fr) 40px; gap: 10px; align-items: center; font-size: 13px; }
.bkbar { height: 8px; background: var(--line-2); border-radius: 99px; overflow: hidden; }
.bkbar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bk b { text-align: right; }
.sechead { font-size: 16px; margin: 22px 0 10px; }
.pbgrid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
.pbtext { width: 100%; min-height: 560px; font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); resize: vertical; }
.pbchat { position: sticky; top: 76px; display: flex; flex-direction: column; max-height: calc(100vh - 96px); margin: 0; }
.pbchat .cp-msgs { padding: 0; min-height: 200px; }
.diffview { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 0; font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-x: auto; }
.sbs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); padding: 0 0 6px; }
.sbs .sh { padding: 8px 14px; font: 600 12px/1.4 Inter, -apple-system, sans-serif; color: var(--muted); border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.sl { padding: 0 14px; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.sl.l, .sbs .sh.l { border-right: 1px solid var(--line); }
.sl.add { background: var(--fast-soft); color: var(--fast); }
.sl.del { background: var(--competitor-soft); color: var(--competitor); }
.sl.empty { background: var(--panel-2); }
.sl.skip { grid-column: 1 / -1; color: var(--faint); font-style: italic; border-top: 1px dashed var(--line); border-bottom: 1px dashed var(--line); margin: 2px 0; }
.sechead span { color: var(--muted); font-weight: 500; font-size: 13px; margin-left: 8px; }

.cp { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); background: var(--panel); border-left: 1px solid var(--line); box-shadow: var(--shadow); z-index: 45; display: flex; flex-direction: column; transform: translateX(105%); transition: transform .2s ease; }

.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; }

dialog textarea, .ed textarea, .pb textarea { width: 100%; font: 13px/1.5 Inter, sans-serif; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); color: var(--ink); margin: 10px 0 12px; resize: vertical; }
.brief { background: var(--accent-soft); border-radius: 10px; padding: 11px 13px; margin: 6px 0 12px; font-size: 13.5px; }

.brief .op b { color: var(--ink); }
.row .brief-line { color: var(--ink); font-size: 12.5px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.chip.dnc { background: var(--competitor-soft); color: var(--competitor); font-weight: 600; }

.crit { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }

<body>
<header>
  <div class="brand"><b>Event Lead Cockpit</b><span>Case study for GeneralMind · Pierre Park · <a href="writeup" target="_blank" rel="noopener">Write-up ↗</a></span></div>
  <nav id="tabs">
    <button data-view="events" class="on">Events</button>
    <button data-view="people">People</button>
    <button data-view="playbooks">Playbooks</button>
    <button data-view="feedback">Feedback</button>
    <button data-view="settings">Settings</button>
  </nav>
  <div class="who">
    <button id="cpBtn" class="pill cp-open" title="Ask questions, propose changes">✦ Copilot</button>
    <button id="hsPill" class="pill" title="HubSpot connection"><i class="dot"></i>HubSpot</button>
    <span id="built"></span>
    <button id="whoBtn" title="Your name is saved with your decisions">Reviewer: <b id="whoName">—</b></button>
  </div>
</header>
<aside id="cp" class="cp" aria-label="Copilot">
  <div class="cp-head"><b>Copilot</b><select id="cpModel" title="Model (via OpenRouter)"></select><button id="cpClear" class="btn" title="Start a new conversation">New</button><button id="cpClose" class="close" style="display:block" aria-label="Close">×</button></div>
  <div class="cp-msgs" id="cpMsgs"></div>
  <form id="cpForm" class="cp-form"><textarea id="cpIn" rows="2" placeholder="Ask about events, people or how the cockpit works… (Enter to send)"></textarea><button class="btn primary">Send</button></form>
</aside>
<button id="fbBtn" class="fb-btn" title="Point at something and leave a note">Feedback</button>

<main>
  <section class="view on" id="v-events">
    <div id="eventsList"></div>
    <div id="eventPage" style="display:none">
      <div id="eventTop"></div>
      <div id="eventPeopleSlot">
        <div id="peopleBlock">
          <div class="stabs" id="statusTabs"></div>
          <div class="toolbar">
            <input type="search" id="q" placeholder="Search name, title, company…">
            <select id="fSuggest">
              <option value="">All suggestions</option>
              <option value="fast_track">Strong fit</option>
              <option value="review">Possible</option>
              <option value="filtered">Low fit</option>
            </select>
            <select id="fFunction"></select>
            <select id="fSort">
              <option value="score">Sort: fit</option>
              <option value="company">Sort: company</option>
            </select>
            <label title="Partners, competitors and existing customers are kept out of review by default"><input type="checkbox" id="fOther"> Partners, competitors &amp; customers</label>
            <span class="count" id="qCount"></span>
          </div>
          <div class="toolbar pushbar" id="pushBar" style="display:none"></div>
          <div class="layout">
            <div class="list" id="qList"></div>
            <aside class="drawer" id="drawer"></aside>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="view" id="v-people">
    <div class="panel evhead" id="peopleHead"></div>
    <div id="peopleSlot"></div>
  </section>

  <section class="view" id="v-feedback"><div id="feedbackView"></div></section>
  <section class="view" id="v-criteria"><div id="criteria"></div></section>
  <section class="view" id="v-playbooks"><div id="playbooks"></div></section>
  <section class="view" id="v-settings"><div id="settingsView"></div></section>
</main>

<dialog id="whoDlg">
  <form method="dialog">
    <b>Who's reviewing?</b>
    <div style="color:var(--muted);font-size:13px;margin-top:4px">Your first name is saved with each decision, so the team can see who decided what.</div>
    <input id="whoInput" maxlength="40" placeholder="e.g. Tom" autocomplete="given-name">
    <div style="display:flex;gap:8px;flex-direction:row-reverse"><button class="btn primary" value="ok">Save</button><button class="btn" value="cancel">Skip</button></div>
  </form>
</dialog>
<dialog id="fbDlg">
  <form method="dialog">
    <b>Feedback</b>
    <div id="fbTarget" class="note" style="margin:8px 0 0"></div>
    <textarea id="fbText" rows="4" placeholder="What should change?"></textarea>
    <div style="display:flex;gap:8px;flex-direction:row-reverse"><button class="btn primary" value="ok">Send</button><button class="btn" value="cancel">Cancel</button></div>
  </form>
</dialog>
<div class="toast" id="toast"></div>

<script>
const LANES = {
  fast_track: { label: 'Strong fit', hint: 'Suggested approve' },
  review: { label: 'Possible', hint: 'Needs a look' },
  filtered: { label: 'Low fit', hint: 'Low fit, vendors, other' },
  partner: { label: 'Partners', hint: 'SIs, consultancies, ERP' },
  competitor: { label: 'Competitors', hint: 'Kept as market intel' },
  customer: { label: 'Customers', hint: 'Route to account owner' },
};
const REJECT_REASONS = ['Wrong role', 'Company too small', 'Wrong industry', 'Vendor / competitor', 'Already a customer or in CRM', 'Bad data'];
const FUNCTION_LABELS = {
  order_to_cash: 'Order management / customer service', finance_ap: 'Finance / AP / shared services', procurement: 'Procurement',
  supply_chain: 'Supply chain / logistics', operations: 'Operations / digital', general_management: 'General management', none: 'Other functions',
};

const S = {
  data: null, events: {}, accounts: {}, contacts: [], decisions: new Map(), history: [],
  status: 'review', pushSel: new Set(), hsFound: {}, hsChecking: new Set(), hsFailedAt: 0, sending: false, eventId: null, peopleScope: undefined, evOpen: null, evFilter: 'all',
  sel: null, reviewer: '', view: 'events', undo: [],
};

const $ = id => document.getElementById(id);

// ---------- what happened before a note or an error ----------
const TRAIL = [];
function track(type, detail) {
  TRAIL.push({ t: new Date().toISOString().slice(11, 19), type, detail: String(detail ?? '').slice(0, 160) });
  if (TRAIL.length > 40) TRAIL.shift();
}
function describeEl(el) {
  const label = (el.dataset.view && `tab ${el.dataset.view}`) || (el.dataset.lane && `lane ${el.dataset.lane}`) || (el.dataset.act && `${el.dataset.act}`) || (el.innerText || el.value || el.title || '').trim().replace(/\s+/g, ' ').slice(0, 60);
  const row = el.closest('[data-id]')?.dataset.id;
  return `${el.tagName.toLowerCase()} "${label}"${row ? ` on ${row}` : ''}`;
}
function appState() {
  const v = id => document.getElementById(id)?.value || '';
  return { view: S.view, url: location.pathname, filters: { q: v('q'), event: S.eventId || S.peopleScope, fn: v('fFunction'), sort: v('fSort'), suggestion: v('fSuggest'), other: !!document.getElementById('fOther')?.checked },
    status: S.status, contact: S.sel, going: S.data ? goingIds() : [], scoring_version: S.data?.meta?.scoring_version, app_version: S.data?.meta?.app_version,
    role: S.data?.meta?.role, reviewer: S.reviewer, viewport: `${innerWidth}x${innerHeight}`, ua: navigator.userAgent.slice(0, 120) };
}
const context = () => ({ trail: TRAIL.slice(-25), state: appState() });
const nativeFetch = window.fetch.bind(window);
const reported = new Set();
function reportError(message, detail) {
  if (!message || reported.has(message) || reported.size > 20) return;
  reported.add(message);
  track('error', message);
  nativeFetch('api/errors', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: String(message).slice(0, 1000), detail: detail ? String(detail).slice(0, 8000) : null, context: context(), author: S.reviewer || null }) }).catch(() => {});
}
window.addEventListener('error', e => reportError(e.message, e.error?.stack));
window.addEventListener('unhandledrejection', e => reportError(String(e.reason?.message || e.reason), e.reason?.stack));
window.fetch = async (url, opts = {}) => {
  const method = (opts.method || 'GET').toUpperCase();
  try {
    const res = await nativeFetch(url, opts);
    if (method !== 'GET' || !res.ok) track('api', `${method} ${url} → ${res.status}`);
    if (res.status >= 500) reportError(`${method} ${url} returned ${res.status}`);
    return res;
  } catch (err) { reportError(`${method} ${url} failed: ${err.message}`, err.stack); throw err; }
};
document.addEventListener('click', e => { const el = e.target.closest('button, a, .row, .stat, input[type=checkbox]'); if (el) track('click', describeEl(el)); }, true);
document.addEventListener('change', e => {
  const t = e.target; if (!t.matches('select, input, textarea')) return;
  track('change', `${t.id || t.name || t.dataset.path || t.dataset.list || t.tagName.toLowerCase()} = ${t.type === 'password' ? '(hidden)' : String(t.value).slice(0, 60)}`);
}, true);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : null;
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } };
const today = () => new Date(new Date().toDateString());
const daysTo = d => Math.round((new Date(d + 'T00:00:00') - today()) / 864e5);
const fmtDate = (a, b) => {
  const o = { day: 'numeric', month: 'short' }, A = new Date(a + 'T00:00:00'), B = new Date(b + 'T00:00:00');
  return `${A.toLocaleDateString('en-GB', o)}–${B.toLocaleDateString('en-GB', { ...o, year: 'numeric' })}`;
};
const until = d => { const n = daysTo(d); return n < 0 ? 'past' : n === 0 ? 'today' : n < 60 ? `in ${n} days` : `in ${Math.round(n / 30.4)} months`; };
const key = (t, id) => `${t}:${id}`;
const decisionOf = (t, id) => S.decisions.get(key(t, id));
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 1800); }

async function load() {
  const [res, cfg] = await Promise.all([fetch('api/data'), fetch('api/config')]);
  if (res.status === 401) { location.reload(); return; }
  const d = await res.json();
  S.data = d; S.config = await cfg.json();
  S.events = {}; S.accounts = {}; S.decisions = new Map();
  d.events.sort((a, b) => a.start.localeCompare(b.start));
  d.events.forEach(e => S.events[e.id] = e);
  d.accounts.forEach(a => S.accounts[a.id] = a);
  S.contacts = d.contacts;
  S.history = d.decisions;
  d.decisions.forEach(applyDecision);
  S.suppressed = new Map(d.suppression.map(s => [s.key, s]));
  S.hs = new Map(d.hubspot.map(h => [key(h.object_type, h.object_id), h.hubspot_id]));
  $('built').textContent = `Scoring v${d.meta.scoring_version} · build ${d.meta.app_version}`;
  refreshHubspot();
  S.reviewer = store.get('reviewer') || '';
  $('whoName').textContent = S.reviewer || '—';
  fillFilters();
  renderAll();
}

function applyDecision(d) {
  const k = key(d.object_type, d.object_id);
  if (d.decision === 'clear') S.decisions.delete(k); else S.decisions.set(k, d);
}

function fillFilters() {
  const keep = $('fFunction').value;
  $('fFunction').innerHTML = '<option value="">All functions</option>' + Object.entries(FUNCTION_LABELS).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join('');
  $('fFunction').value = keep;
}

function renderAll() { if (S.view === 'people') renderPeople(); else renderEvents(); renderCriteria(); renderPlaybooks(); renderExport(); if (S.view === 'settings') renderSettings(); }
const isSuppressed = c => S.suppressed.has(c.person_key) || S.suppressed.has(c.id) || (c.account_id && S.suppressed.has(S.accounts[c.account_id]?.profile?.domain));
const hsKey = c => key('contact', c.person_key);

// ---------- statuses and suggestions ----------
// Everything starts in "To review". The score only suggests; a person decides.
const STATUS = [['review', 'To review'], ['approved', 'Approved'], ['hubspot', 'In HubSpot'], ['rejected', 'Rejected']];
const SUGGEST = { fast_track: 'Strong fit', review: 'Possible', filtered: 'Low fit', partner: 'Partner', competitor: 'Competitor', customer: 'Customer' };
const OTHER_LANES = new Set(['partner', 'competitor', 'customer']);
const EVENT_LANES = { recommended: ['Recommended', 'fast_track'], consider: ['Worth considering', 'review'], skip: ['Probably skip', 'filtered'], past: ['Already happened', 'filtered'] };

function statusOf(c) {
  const d = decisionOf('contact', c.id);
  // "In HubSpot" means this event listing was sent; the person may already be there from another event
  if (d?.decision === 'approve') return S.hs.has(key('listing', c.id)) ? 'hubspot' : 'approved';
  if (d?.decision === 'reject') return 'rejected';
  return 'review';
}
const goingIds = () => S.data.events.filter(e => decisionOf('event', e.id)?.decision === 'approve').map(e => e.id);
const hubspotUrl = (kind, hid) => hid && S.hsStatus?.portal_id ? `https://${S.hsStatus.ui_domain || 'app.hubspot.com'}/contacts/${S.hsStatus.portal_id}/record/${kind === 'account' ? '0-2' : '0-1'}/${hid}` : null;
function topReasons(reasons, n = 3) {
  return reasons.filter(r => r.points > 0).sort((a, b) => b.points - a.points).slice(0, n)
    .map(r => `<span class="chip pts"><b>+${r.points}</b> ${esc(r.label)}</span>`).join('');
}

// ---------- events: the list ----------
// Upcoming events are about where to go; past ones about what going gave us.
const EVENT_TABS = { upcoming: [['all', 'All'], ['todo', 'To decide'], ['going', 'Going'], ['notgoing', 'Not going']],
                     past: [['all', 'All'], ['went', 'Went'], ['skipped', 'Skipped'], ['undecided', 'Not decided']] };
const pastStatus = e => ({ approve: 'went', reject: 'skipped' })[decisionOf('event', e.id)?.decision] || 'undecided';
function eventStatus(e) {
  if (e.past) return 'past';
  const d = decisionOf('event', e.id)?.decision;
  return d === 'approve' ? 'going' : d === 'reject' ? 'notgoing' : 'todo';
}
const EVENT_STATUS_LABEL = { todo: 'To decide', going: '✓ Going', notgoing: 'Not going', past: 'Already happened' };
const fmtDay = d => d ? new Date(d.slice(0, 10) + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '';

function eventStatusLabel(e) {
  const st = eventStatus(e);
  if (st !== 'past') return EVENT_STATUS_LABEL[st];
  const d = decisionOf('event', e.id)?.decision;
  return `Happened · ${d === 'approve' ? 'went' : d === 'reject' ? 'skipped' : 'not decided'}`;
}
// The meeting plan: time is the limit, not the number of good names.
function planFor(e) {
  const p = e.plan || { days: 1, team_default: 1, per_day: 8, by_team: {} };
  const team = e.team || p.team_default, cur = p.by_team?.[team] || { meetings: 0, slots: 0, avg: 0, total: 0 }, nxt = p.by_team?.[team + 1];
  const extra = nxt ? nxt.meetings - cur.meetings : 0;
  return { ...p, team, meetings: cur.meetings, slots: cur.slots, bestAvg: cur.avg, schedule: cur.schedule || [], clashes: cur.clashes || 0,
           nextCount: extra, nextAvg: extra > 0 ? Math.round((nxt.total - cur.total) / extra) : 0 };
}
const travelText = t => !t ? '—' : t.mode === 'local' ? 'In Berlin' : `${t.hours} h ${t.mode}`;
const EVENT_COLS = [
  ['score', 'Score', e => e.score],
  ['name', 'Event', e => e.name.toLowerCase()],
  ['date', 'Date', e => e.start],
  ['travel', 'Travel', e => e.travel?.hours ?? 99],
  ['quality', 'Best N', e => planFor(e).bestAvg],
  ['meetings', 'Meetings', e => planFor(e).meetings],
  ['approved', 'Approved', e => { const n = statusCounts([e.id]); return n.approved + n.hubspot; }],
  ['status', 'Status', e => ({ going: 0, todo: 1, notgoing: 2, past: 3 })[eventStatus(e)]],
  ['found', 'Found', e => e.added_at || ''],
];

function renderEventsList() {
  const when = S.evWhen || 'upcoming', filter = S.evFilter || 'all', sort = S.evSort || { key: 'score', dir: -1 };
  const inWhen = S.data.events.filter(e => (when === 'past') === !!e.past);
  const sub = e => when === 'past' ? pastStatus(e) : eventStatus(e);
  const counts = { all: inWhen.length };
  inWhen.forEach(e => { counts[sub(e)] = (counts[sub(e)] || 0) + 1; });
  const col = EVENT_COLS.find(c => c[0] === sort.key) || EVENT_COLS[0];
  const events = inWhen.filter(e => filter === 'all' || sub(e) === filter)
    .sort((a, b) => { const x = col[2](a), y = col[2](b); return (x < y ? -1 : x > y ? 1 : 0) * sort.dir || b.score - a.score; });
  $('eventsList').innerHTML = `
    <div class="panel step">
      <div><div class="stepno">Step 1</div><h3>Choose the events worth going to</h3>
        <p class="lead" style="margin:0">Time limits how many people we can meet, so each event is judged on the <b>best people we could actually meet there</b> (<b>Best N</b>: their average fit, where N is the meetings possible), plus whether GeneralMind is a partner there, timing, travel and whether this year's list is out. Mark events ✓ Going or ✕ Not going; open one to see why it scored as it did and who to meet.</p></div>
    </div>
    <div class="whenbar">${[['upcoming', 'Upcoming'], ['past', 'Past']].map(([k, l]) => `<button class="${when === k ? 'on' : ''}" data-when="${k}">${l} <span class="num">${S.data.events.filter(e => (k === 'past') === !!e.past).length}</span></button>`).join('')}</div>
    <div class="stabs">${EVENT_TABS[when].map(([k, l]) => `<button class="stab ${filter === k ? 'on' : ''}" data-evf="${k}">${l} <span class="num">${counts[k] || 0}</span></button>`).join('')}</div>
    <div class="list evlistwrap">${events.length ? `<div class="evtable head">${EVENT_COLS.map(([k, l]) => `<button class="sorth ${sort.key === k ? 'on' : ''}" data-sort="${k}" title="Sort by ${l.toLowerCase()}">${l}${sort.key === k ? (sort.dir < 0 ? ' ▼' : ' ▲') : ''}</button>`).join('')}</div>` + events.map(e => {
      const st = eventStatus(e), lane = (EVENT_LANES[e.lane] || ['', 'filtered'])[1], n = statusCounts([e.id]), pl = planFor(e), appr = n.approved + n.hubspot;
      return `<div class="evtable lane-${lane} ${st}" data-ev="${esc(e.id)}">
        <div class="score num">${e.score}</div>
        <div style="min-width:0"><div class="t1" title="${esc(e.name)}">${esc(e.name)}${e.generalmind_present ? ' <span class="badge">partner</span>' : ''}</div><div class="t2">${esc(e.format || '')}${e.access === 'invitation' ? ' · <b style="color:var(--review)">invitation only</b>' : e.access === 'partners' ? ' · <b style="color:var(--review)">vendors only as partners</b>' : ''}</div></div>
        <div class="t2"><b style="color:var(--ink)">${fmtDay(e.start)}</b>${e.end && e.end !== e.start ? `–${fmtDay(e.end)}` : ''}<br>${until(e.start)}</div>
        <div class="t2" title="Approximate door to door from Berlin"><b style="color:var(--ink)">${esc(e.city)}</b><br>${travelText(e.travel)}</div>
        <div class="t2" title="Average fit of the best ${pl.meetings} ${pl.unit === 'exhibitors' ? 'exhibitors' : 'people'} we could meet"><b style="color:var(--ink)">${pl.bestAvg}</b> avg<br>best ${pl.meetings}${pl.unit === 'exhibitors' ? ' exh.' : ''}</div>
        <div class="t2" title="${pl.timetable ? 'From the timetable: the people we can catch in the break after their talk' : `${pl.team} ${pl.team === 1 ? 'person' : 'people'} × ${pl.days} days × up to ${pl.per_day} a day (an estimate until the timetable is out)`}"><b style="color:var(--ink)">${pl.meetings}</b><br>${pl.timetable ? 'timetable' : 'estimate'}</div>
        <div class="t2">${appr ? `<b style="color:var(--fast)">${appr}</b>` : '0'}<br>of ${pl.meetings}</div>
        <div class="evgo">${e.past ? `<span class="chip lane lane-filtered">${eventStatusLabel(e)}</span>`
          : `<button class="btn ok ${st === 'going' ? 'on' : ''}" data-go="approve" title="Going">${st === 'going' ? '✓ Going' : '✓'}</button><button class="btn no ${st === 'notgoing' ? 'on' : ''}" data-go="reject" title="Not going">${st === 'notgoing' ? '✕ Not going' : '✕'}</button>`}</div>
        <div class="t2">${fmtDay(e.added_at)}<br><small>${esc((e.found_by || '').replace(/ \(.*\)$/, ''))}</small></div>
      </div>`;
    }).join('') : `<div class="empty">${when === 'past' && !inWhen.length ? "No past events yet. Events move here once they've happened, showing whether we went. Once HubSpot syncs outcomes back, this is where to see what each event produced." : 'No events here.'}</div>`}</div>
    <div style="color:var(--faint);font-size:11.5px;margin-top:8px">Travel is approximate door to door from Berlin. Meetings: no invitations (cold email isn't allowed), so speakers are met in the break after their talk. Where the timetable is out, the cockpit plans exactly who can be caught; otherwise it's people we'd send × days × up to a set number of conversations a day. Set in <a href="#/playbooks/scoring">Scoring</a> (Meeting plan).</div>`;
  $('eventsList').querySelectorAll('[data-evf]').forEach(b => b.onclick = () => { S.evFilter = b.dataset.evf; renderEventsList(); });
  $('eventsList').querySelectorAll('[data-when]').forEach(b => b.onclick = () => { S.evWhen = b.dataset.when; S.evFilter = 'all'; renderEventsList(); });
  $('eventsList').querySelectorAll('[data-sort]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const k = b.dataset.sort, cur = S.evSort || { key: 'score', dir: -1 };
    S.evSort = cur.key === k ? { key: k, dir: -cur.dir } : { key: k, dir: ['name', 'date', 'travel', 'status'].includes(k) ? 1 : -1 };
    renderEventsList();
  });
  $('eventsList').querySelectorAll('[data-ev]').forEach(r => r.onclick = ev => {
    const go = ev.target.closest('[data-go]')?.dataset.go;
    if (!go) return openEvent(r.dataset.ev);
    const cur = decisionOf('event', r.dataset.ev)?.decision;
    decide('event', r.dataset.ev, cur === go ? 'clear' : go);
  });
}

// ---------- events: one event ----------
function openEvent(id) { S.eventId = id; S.status = 'review'; S.sel = null; S.pushSel.clear(); showView('events'); window.scrollTo(0, 0); }

function renderEventPage() {
  const e = S.events[S.eventId];
  if (!e) { S.eventId = null; return renderEvents(); }
  const st = eventStatus(e), n = statusCounts([e.id]), open = S.evOpen === e.id;
  const extra = S.data.accounts.filter(a => a.events.includes(e.id) && !a.contact_ids.some(id => S.contacts.find(c => c.id === id)?.event_id === e.id)).sort((x, y) => y.score - x.score);
  const maxPts = Math.max(20, ...e.reasons.map(r => r.points));
  $('eventTop').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><a href="#/events" data-back>← All events</a><button class="btn" data-copy="${esc(`#/event/${encodeURIComponent(e.id)}`)}">Copy link</button></div>
    <div class="panel evhead">
      <div style="min-width:0"><div class="stepno">${eventStatusLabel(e)}${e.found_by ? ` · added ${fmtDay(e.added_at)} by ${esc(e.found_by)}` : ''}</div>
        <h3>${esc(e.name)}${e.generalmind_present ? ' <span class="badge">GeneralMind is a partner</span>' : ''}</h3>
        <div class="meta">${fmtDate(e.start, e.end)} · ${esc(e.city)} (${e.travel?.mode === 'local' ? 'no travel' : `${travelText(e.travel)} from Berlin`}) · ${esc(e.format || '')} · ${esc(e.language || '')} · <b>${until(e.start)}</b>${safeUrl(e.url) ? ` · <a href="${esc(e.url)}" target="_blank" rel="noopener">official site ↗</a>` : ''}</div></div>
      <div class="acts2">
        <button class="btn ok ${st === 'going' ? 'on' : ''}" data-going="approve" ${e.past ? 'disabled' : ''}>${st === 'going' ? '✓ Going' : 'Going'}</button>
        <button class="btn no ${st === 'notgoing' ? 'on' : ''}" data-going="reject">${st === 'notgoing' ? '✕ Not going' : 'Not going'}</button>
      </div>
    </div>
    <div class="grid2">
      <div class="panel"><h3>Summary</h3>
        ${e.summary ? `<div class="pb"><div class="md">${md(e.summary)}</div></div><div style="color:var(--faint);font-size:11.5px;margin-top:8px">Written by ${esc(e.summary_model || 'AI')} from the cockpit's data, ${esc((e.summary_at || '').slice(0, 10))}. <button class="kwbtn" data-summ>Rewrite</button></div>`
          : `<p class="lead">A short AI briefing: why go, who to meet, and the main caveat, written from this event's data.</p><button class="btn primary" data-summ>Write the summary</button>`}
      </div>
      <div class="panel"><h3>Why it scored ${e.score} <span class="chip lane lane-${(EVENT_LANES[e.lane] || ['', 'filtered'])[1]}">${(EVENT_LANES[e.lane] || ['Unscored'])[0]}</span></h3>
        <div class="breakdown">${e.reasons.map(r => `<div class="bk"><span>${esc(r.label)}</span><div class="bkbar"><span style="width:${Math.round(100 * r.points / maxPts)}%"></span></div><b class="num">${r.points ? '+' + r.points : '0'}</b></div>`).join('')}</div>
        <div style="color:var(--faint);font-size:11.5px;margin-top:8px">${e.score} of 100. The weights are in <a href="#/playbooks/scoring">Scoring</a> (Events: which to go to).</div>
      </div>
    </div>
    ${e.access === 'invitation' ? `<div class="note" style="margin:0 0 16px"><b>Invitation only:</b> attending needs an invitation from the organiser (or a sponsor or partner slot). Ask early, before planning meetings.</div>` : e.access === 'partners' ? `<div class="note" style="margin:0 0 16px"><b>Vendors only as partners:</b> companies selling to the attendees can't buy a delegate ticket; they attend as a paying commercial partner.</div>` : ''}
    ${planBlock(e, n)}
    <div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">About this event</h3><button class="kwbtn" data-more>${open ? 'Less' : 'More'}</button></div>
      <p style="margin:8px 0 0;font-size:13.5px">${esc(e.why || '')}</p>
      ${open ? `<div style="margin-top:8px;font-size:13px">${e.date_note ? `<div class="note">${esc(e.date_note)}</div>` : ''}
        <div style="margin-top:6px"><b>Where the names come from:</b> ${e.sources.map(x => { const u = safeUrl(x.url); return `${u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(x.type)}</a>` : esc(x.type)} (${esc(x.edition)})`; }).join(' · ') || '—'}</div>
        ${extra.length ? `<div style="margin-top:8px"><b>Exhibiting with no named person yet (${extra.length}):</b></div><div class="chips" style="margin-top:4px">${extra.slice(0, 30).map(a => `<span class="chip">${esc(a.name)}${a.lane === 'fast_track' ? ' ★' : ''}</span>`).join('')}${extra.length > 30 ? `<span class="chip">and ${extra.length - 30} more</span>` : ''}</div><div class="note">At a trade fair these exhibitors are the prospects; the next step is finding the right person at each through an enrichment provider. ★ marks a strong-fit company.</div>` : ''}</div>` : ''}
    </div>
    <h3 class="sechead">People at this event <span>${e.not_sourced ? '' : `${n.strong} strong fit still to review · ${n.approved + n.hubspot} approved to meet`}</span></h3>
    ${e.not_sourced ? `<div class="panel"><div class="note" style="margin:0">People not sourced yet: reading this event's speaker and exhibitor lists hasn't run.</div></div>` : ''}`;
  const top = $('eventTop');
  top.querySelectorAll('[data-going]').forEach(b => b.onclick = () => decide('event', e.id, decisionOf('event', e.id)?.decision === b.dataset.going ? 'clear' : b.dataset.going));
  top.querySelector('[data-more]').onclick = () => { S.evOpen = open ? null : e.id; renderEventPage(); };
  top.querySelector('[data-team]').onchange = async ev => {
    const people = +ev.target.value;
    const r = await fetch(`api/events/${encodeURIComponent(e.id)}/team`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ people }) });
    if (!r.ok) return toast('Could not save');
    e.team = people; toast(`Planning for ${people} ${people === 1 ? 'person' : 'people'}`); renderEventPage();
  };
  top.querySelector('[data-back]').onclick = ev => { ev.preventDefault(); S.eventId = null; showView('events'); };
  top.querySelectorAll('[data-summ]').forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = 'Writing…';
    const r = await fetch(`api/events/${encodeURIComponent(e.id)}/summary`, { method: 'POST' });
    const out = await r.json().catch(() => ({}));
    if (!r.ok) { toast(out.detail || 'Could not write the summary'); b.disabled = false; b.textContent = 'Try again'; return; }
    Object.assign(e, { summary: out.text, summary_model: out.model, summary_at: new Date().toISOString() }); renderEventPage();
  });
  wireCopy(top);
  $('peopleBlock').style.display = e.not_sourced ? 'none' : '';
}

function planBlock(e, n) {
  const pl = planFor(e), appr = n.approved + n.hubspot, strongFrom = S.data.meta.lanes.fast_track, unit = pl.unit === 'exhibitors' ? 'exhibitors' : 'people';
  const pct = pl.meetings ? Math.min(100, Math.round(100 * appr / pl.meetings)) : 0, days = `<b>${pl.days}</b> day${pl.days > 1 ? 's' : ''}`;
  const team = `<select data-team>${[1, 2, 3, 4].map(k => `<option value="${k}" ${k === pl.team ? 'selected' : ''}>${k} ${k === 1 ? 'person' : 'people'}</option>`).join('')}</select>`;
  const what = pl.timetable
    ? `We'd send ${team} for ${days}. From the timetable, <b>${pl.meetings}</b> of the best ${unit} can be caught in the break after their talk (up to ${pl.per_day} conversations a day each). They average a fit of <b>${pl.bestAvg}</b>.${pl.clashes ? ` ${pl.clashes} strong fit${pl.clashes > 1 ? 's' : ''} clash with someone better in the same break.` : ''}`
    : `We'd send ${team} × ${days} × up to <b>${pl.per_day}</b> conversations a day = <b>${pl.slots} meetings</b>. The best ${pl.meetings} ${unit} here average a fit of <b>${pl.bestAvg}</b>.${pl.meetings < pl.slots ? ` Only ${pl.meetings} ${unit} for ${pl.slots} meetings, so some time stays free.` : ''}${unit === 'people' ? ` <span style="color:var(--muted)">An estimate until the timetable is out.</span>` : ''}`;
  const more = !pl.nextCount ? `Nobody left for another person: ${pl.team === 1 ? 'one person is enough' : `${pl.team} is already more than the list fills`}.`
    : pl.nextAvg >= strongFrom ? `Another person would add ${pl.nextCount} meetings with ${unit} averaging ${pl.nextAvg}: <b>worth it</b>.`
    : `Another person would add meetings with ${unit} averaging only ${pl.nextAvg}: <b>probably not worth it</b>.`;
  const who = id => { const c = S.contacts.find(x => x.id === id); return c ? `<a href="${personHash(c)}">${esc(c.name)}</a>${c.company ? ` <span style="color:var(--muted)">${esc(c.company)}</span>` : ''}` : ''; };
  const schedule = pl.schedule.length ? `<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600">Who to catch, break by break</summary>
      ${pl.schedule.map(b => `<div style="margin-top:8px"><div class="t2"><b style="color:var(--ink)">${fmtDay(b.date)} · ${esc(b.start)}${b.end ? `–${esc(b.end)}` : ''}</b> ${esc(b.kind)}</div><div style="font-size:13px">${b.ids.map(who).filter(Boolean).join(' · ')}</div></div>`).join('')}</details>` : '';
  return `<div class="panel"><h3>Meeting plan</h3>
    <div class="plan">${what}</div>
    <div class="note">${unit === 'exhibitors' ? 'Exhibitors are met at their stands; no booking needed.' : "No invitations: cold email isn't allowed, so speakers are met in the break after their talk."} ${more}${e.generalmind_present ? ' GeneralMind is a partner here, so the default is two people.' : ''}</div>
    ${schedule}
    ${pl.meetings ? `<div style="display:flex;align-items:center;gap:10px;margin-top:10px"><div class="meter" style="flex:1;height:10px"><span style="width:${pct}%"></span></div><span class="num" style="font-size:13px"><b>${appr}</b> approved of ${pl.meetings}</span></div>` : ''}</div>`;
}

function renderEvents() {
  const onEvent = !!S.eventId;
  $('eventsList').style.display = onEvent ? 'none' : '';
  $('eventPage').style.display = onEvent ? '' : 'none';
  if (onEvent) { renderEventPage(); renderPeople(); } else { renderEventsList(); if (S.view === 'events') syncHash(); }
}

// ---------- people across events ----------
function renderPeopleHead() {
  const going = goingIds(), scope = currentScope();
  $('peopleHead').innerHTML = `<div><div class="stepno">Step 2 · across events</div><h3>${scope === 'going' ? `People at the ${going.length} event${going.length > 1 ? 's' : ''} we're going to` : 'Everyone, all events'}</h3>
    <div class="meta">Grouped by event, soonest first. Usually it's easier to open one event in <a href="#/events">Events</a>; this view is for working across events at once.</div></div>
    <div class="acts2"><select id="pScope"><option value="going" ${going.length ? '' : 'disabled'}>Events we're going to (${going.length})</option><option value="">Everyone, all events</option></select>
      <button class="btn" data-copy="${esc(hashFor())}">Copy link</button></div>`;
  $('pScope').value = scope;
  $('pScope').onchange = e => { S.peopleScope = e.target.value; S.sel = null; S.pushSel.clear(); renderPeople(); };
  wireCopy($('peopleHead'));
}

// ---------- people: shared by an event's page and the People page ----------
function currentScope() {
  if (S.view === 'events' && S.eventId) return S.eventId;
  const going = goingIds();
  if (S.peopleScope === undefined || (S.peopleScope === 'going' && !going.length)) S.peopleScope = going.length ? 'going' : '';
  return S.peopleScope;
}
function scopeContacts(ignoreFilters = false) {
  const scope = currentScope(), going = goingIds();
  const q = $('q').value.trim().toLowerCase(), fn = $('fFunction').value, sug = $('fSuggest').value, other = $('fOther').checked;
  return S.contacts.filter(c => {
    if (scope === 'going' ? !going.includes(c.event_id) : scope && c.event_id !== scope) return false;
    if (!other && OTHER_LANES.has(c.lane)) return false;
    if (ignoreFilters) return true;
    if (sug && c.lane !== sug) return false;
    if (fn && !c.tags.includes(`function:${fn}`)) return false;
    if (q && !`${c.name} ${c.title} ${c.company} ${S.accounts[c.account_id]?.name || ''} ${c.session}`.toLowerCase().includes(q)) return false;
    return true;
  });
}
// People are always grouped by event (soonest first), then sorted within the event.
function contactRows() {
  const rows = scopeContacts().filter(c => statusOf(c) === S.status);
  const by = $('fSort').value === 'company'
    ? (a, b) => (S.accounts[a.account_id]?.name || a.company || '').localeCompare(S.accounts[b.account_id]?.name || b.company || '') || b.score - a.score
    : (a, b) => b.score - a.score || a.name.localeCompare(b.name);
  return rows.sort((a, b) => S.events[a.event_id].start.localeCompare(S.events[b.event_id].start) || a.event_id.localeCompare(b.event_id) || by(a, b));
}

function statusCounts(eventIds) {
  const counts = { review: 0, approved: 0, hubspot: 0, rejected: 0, strong: 0 };
  S.contacts.forEach(c => {
    if (!eventIds.includes(c.event_id) || OTHER_LANES.has(c.lane)) return;
    const st = statusOf(c); counts[st]++;
    if (st === 'review' && c.lane === 'fast_track') counts.strong++;
  });
  return counts;
}

function actionsCell(c) {
  const st = statusOf(c), d = decisionOf('contact', c.id);
  if (st === 'review') return `<div class="acts"><button class="btn ok icon" data-act="approve" title="Approve (A)">✓</button><button class="btn no icon" data-act="reject" title="Reject (R)">✕</button></div>`;
  if (st === 'approved') return `<div class="acts"><button class="btn" data-act="clear" title="Back to review" style="font-size:12px;padding:3px 9px">Unapprove</button></div>`;
  if (st === 'hubspot') { const u = hubspotUrl('contact', S.hs.get(hsKey(c))); return `<div class="acts">${u ? `<a class="chip hs" href="${esc(u)}" target="_blank" rel="noopener">Open ↗</a>` : '<span class="chip hs">In HubSpot</span>'}</div>`; }
  return `<div class="acts" style="flex-direction:column;align-items:flex-end;gap:2px"><small style="color:var(--muted)">${esc(d?.reason || 'Rejected')}</small><button class="btn" data-act="clear" style="font-size:12px;padding:2px 8px">Restore</button></div>`;
}

function renderPeople() {
  if (!S.data) return;
  const onEvent = S.view === 'events' && !!S.eventId;
  if (S.view === 'events' && !onEvent) return;
  const slot = onEvent ? $('eventPeopleSlot') : $('peopleSlot');
  if ($('peopleBlock').parentElement !== slot) slot.appendChild($('peopleBlock'));
  if (!onEvent) { $('peopleBlock').style.display = ''; renderPeopleHead(); }
  const scope = currentScope();
  const scoped = scopeContacts(), counts = {};
  scoped.forEach(c => { const st = statusOf(c); counts[st] = (counts[st] || 0) + 1; });
  $('statusTabs').innerHTML = STATUS.map(([k, label]) => `<button class="stab ${S.status === k ? 'on' : ''}" data-st="${k}">${label} <span class="num">${counts[k] || 0}</span></button>`).join('');
  $('statusTabs').querySelectorAll('[data-st]').forEach(b => b.onclick = () => { S.status = b.dataset.st; S.sel = null; S.pushSel.clear(); renderPeople(); });
  const rows = contactRows();
  $('qCount').textContent = `${rows.length} ${rows.length === 1 ? 'person' : 'people'}`;
  if (!rows.find(r => r.id === S.sel)) S.sel = rows[0]?.id || null;
  [...S.pushSel].forEach(id => { const c = S.contacts.find(x => x.id === id); if (!c || statusOf(c) !== 'approved' || isSuppressed(c)) S.pushSel.delete(id); });
  const st = S.hsStatus || {}, ev = S.events[scope];
  if (S.status === 'approved' && st.ok) checkHubspot(rows);
  $('pushBar').style.display = S.status === 'approved' ? '' : 'none';
  if (S.status === 'approved') $('pushBar').innerHTML = `
    <label><input type="checkbox" id="selAll" ${rows.length && rows.every(r => isSuppressed(r) || S.pushSel.has(r.id)) ? 'checked' : ''}> Select all${ev ? ` at ${esc(ev.short)}` : ''}</label>
    <button class="btn primary" id="pushSel" ${S.pushSel.size && st.ok && !S.sending ? '' : 'disabled'}>${S.sending ? 'Sending…' : `Send ${S.pushSel.size || ''} to HubSpot`}</button>
    <a class="btn" href="api/export/contacts.csv${ev ? `?event=${encodeURIComponent(ev.id)}` : scope === 'going' ? `?event=${encodeURIComponent(goingIds().join(','))}` : ''}">Download CSV${ev ? ` for ${esc(ev.short)}` : scope === 'going' ? ' for these events' : ''}</a>
    <span style="color:var(--muted);font-size:12.5px"><i class="dot ${st.ok ? 'ok' : st.configured ? 'bad' : ''}"></i> ${st.ok ? 'HubSpot connected' : st.configured ? 'HubSpot not reachable' : 'Connect HubSpot in Settings'}</span>
    <span style="color:var(--muted);font-size:12.5px" title="People and their companies">${st.ok ? sendPlan() : ''}</span>
    <span id="pushMsg" style="font-size:12.5px">${S.pushResult || ''}</span>`;
  const noPeople = ev && !S.contacts.some(c => c.event_id === ev.id);
  const empty = noPeople ? `No named people at ${esc(ev.short)} yet: its lists only name exhibiting companies (${ev.counts.companies_without_contact}). Click More under "About this event" to see them; the next step is finding the right person at each through an enrichment provider.` : { review: 'Nothing left to review here.', approved: 'Nobody approved yet. Approve people in To review.', hubspot: 'Nobody sent to HubSpot yet. Send approved people from the Approved tab.', rejected: 'Nobody rejected.' }[S.status];
  const head = `<div class="row head"><div>Fit</div><div>Person</div><div class="c-company">Company</div><div class="c-reasons">In five seconds</div><div style="text-align:right">${S.status === 'review' ? 'Decide' : ''}</div></div>`;
  let html = '', lastEvent = null;
  const perEvent = {};
  rows.forEach(c => { perEvent[c.event_id] = (perEvent[c.event_id] || 0) + 1; });
  rows.forEach(c => {
    if (c.event_id !== lastEvent) {
      const e = S.events[c.event_id];
      html += `<div class="grouphead">${esc(e.name)} <span>${fmtDate(e.start, e.end)} · ${esc(e.city)} · ${perEvent[c.event_id]} ${STATUS.find(x => x[0] === S.status)[1].toLowerCase()}</span></div>`;
      lastEvent = c.event_id;
    }
    const a = S.accounts[c.account_id], p = a?.profile || {};
    html += `<div class="row lane-${c.lane} ${c.id === S.sel ? 'sel' : ''}" data-id="${esc(c.id)}">
      <div class="fitcell">${S.status === 'approved' ? `<input type="checkbox" class="pick" ${S.pushSel.has(c.id) ? 'checked' : ''} ${isSuppressed(c) ? 'disabled title="On the do-not-contact list"' : 'title="Select for HubSpot"'}>` : ''}<div class="score num">${c.score}</div><div class="sug">${SUGGEST[c.lane]}</div></div>
      <div><div class="t1">${esc(c.name)}</div><div class="t2">${esc(c.title || 'No title listed')}</div></div>
      <div class="c-company"><div class="t1">${esc(a?.name || c.company || '—')}</div><div class="chips">${p.industry ? `<span class="chip">${esc(p.industry)}</span>` : ''}${p.hq_country ? `<span class="chip">${esc(p.hq_country)}</span>` : ''}${c.confidence === 'low' ? '<span class="chip warn">check data</span>' : ''}</div></div>
      <div class="c-reasons">${isSuppressed(c) ? '<span class="chip dnc">Do not contact</span> ' : ''}${S.status !== 'hubspot' && S.hs.has(hsKey(c)) && !S.hsFound[c.person_key]?.contact ? '<span class="chip hs" title="Sent from another event">Already in HubSpot</span> ' : ''}${c.brief ? `<div class="brief-line">${esc(c.brief)}</div>` : `<div class="chips">${topReasons(c.reasons)}</div>`}${S.status === 'approved' ? hsLine(c) : ''}</div>
      ${actionsCell(c)}
    </div>`;
  });
  $('qList').innerHTML = rows.length ? head + html : `<div class="empty">${empty}</div>`;
  $('qList').querySelectorAll('.row[data-id]').forEach(r => r.onclick = e => {
    const id = r.dataset.id;
    if (e.target.closest('.pick')) { e.target.checked ? S.pushSel.add(id) : S.pushSel.delete(id); renderPeople(); return; }
    if (e.target.closest('a')) return;
    const act = e.target.closest('[data-act]')?.dataset.act;
    S.sel = id; rejectOpenFor = null;
    if (act === 'approve' || act === 'clear') decide('contact', id, act);
    else if (act === 'reject') { $('drawer').classList.add('open'); renderPeople(); openReject(); }
    else { $('drawer').classList.add('open'); renderPeople(); }
  });
  if ($('selAll')) $('selAll').onchange = e => { S.pushSel = new Set(e.target.checked ? rows.filter(r => !isSuppressed(r)).map(r => r.id) : []); renderPeople(); };
  if ($('pushSel')) $('pushSel').onclick = pushSelected;
  renderDrawer();
  syncHash();
}

// ---------- shareable links ----------
const VIEWS = ['events', 'people', 'criteria', 'playbooks', 'feedback', 'settings'];
// #/events                                 the list of events
// #/event/<id>[/<status>[/<person>]]       one event and its people
// #/people/<going|all>/<status>[/<person>] people across events
function hashFor(view = S.view) {
  const tail = () => `/${S.status}` + (S.sel ? `/${encodeURIComponent(S.sel)}` : '');
  if (view === 'events') return S.eventId ? `#/event/${encodeURIComponent(S.eventId)}` + tail() : '#/events';
  if (view === 'people') { const scope = S.data ? currentScope() : (S.peopleScope ?? 'going'); return `#/people/${scope === '' ? 'all' : encodeURIComponent(scope)}` + tail(); }
  if (view === 'playbooks') return S.pbKind ? `#/playbooks/${S.pbKind}` : '#/playbooks';
  if (view === 'criteria') return '#/playbooks/scoring';
  return `#/${view}`;
}
function personHash(c) { return `#/event/${encodeURIComponent(c.event_id)}/${statusOf(c)}/${encodeURIComponent(c.id)}`; }
function syncHash(push = false) {
  const h = hashFor();
  if (location.hash !== h) history[push ? 'pushState' : 'replaceState'](null, '', h);
}
function applyHash() {
  let [view, a, b, c] = location.hash.replace(/^#\/?/, '').split('/').map(x => { try { return decodeURIComponent(x || ''); } catch { return ''; } });
  const status = x => STATUS.some(([k]) => k === x) ? x : 'review';
  // older link shapes: #/events/<scope>/... and #/people/<event id>/...
  if (view === 'events' && a) { if (a === 'going' || a === 'all') view = 'people'; else view = 'event'; }
  if (view === 'people' && a && a !== 'going' && a !== 'all') view = 'event';
  if (view === 'event') { S.eventId = a || null; S.status = status(b); S.sel = c || null; return 'events'; }
  if (view === 'events') { S.eventId = null; return 'events'; }
  if (view === 'people') { S.peopleScope = a === 'all' ? '' : 'going'; S.status = status(b); S.sel = c || null; return 'people'; }
  if (view === 'playbooks' && a === 'scoring') return 'criteria';
  if (view === 'playbooks') { S.pbKind = a || null; return 'playbooks'; }
  return VIEWS.includes(view) ? view : null;
}
function copyLink(hash) {
  const url = `${location.origin}${location.pathname}${hash}`;
  (navigator.clipboard?.writeText(url) || Promise.reject()).then(() => toast('Link copied: anyone with the access code can open it'), () => prompt('Copy this link', url));
}
function wireCopy(el) { el.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copyLink(b.dataset.copy)); }

async function pushSelected() {
  const ids = [...S.pushSel];
  S.sending = true; renderPeople();
  let res, out;
  try { res = await fetch('api/hubspot/push', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contact_ids: ids }) }); out = await res.json(); }
  catch { out = { detail: 'HubSpot took too long to answer. It may still be running: check again in a minute.' }; }
  const names = n => n.length > 8 ? `${n.slice(0, 8).join(', ')} and ${n.length - 8} more` : n.join(', ');
  const notes = [...Object.entries(out.not_sent || {}).map(([why, n]) => `${why}: ${names(n)}`), ...(out.errors || [])];
  S.pushResult = res?.ok ? `<span style="color:var(--fast)">✓ ${esc(out.message)}</span>${notes.length ? ` · ${notes.map(esc).join('; ')}` : ''}` : `<span style="color:var(--competitor)">${esc(out.detail || 'Sending failed')}</span>`;
  if (res?.ok) { toast(`Sent to HubSpot: ${ids.length} ${ids.length === 1 ? 'person' : 'people'}`); S.pushSel.clear(); }
  S.sending = false; S.hsFound = {};
  await load();
}

const closeBtn = '<button class="close" data-close aria-label="Close">×</button>';
function wireClose(el) { el.querySelector('[data-close]').onclick = () => el.classList.remove('open'); }

function breakdown(item) {
  const parts = [['role_fit', 'Role', 45, 'var(--accent)'], ['company_fit', 'Company', 40, 'var(--partner)'], ['event_fit', 'Event', 15, 'var(--review)']];
  return `<div class="bar">${parts.map(([k, , , c]) => `<span style="width:${item[k]}%;background:${c}"></span>`).join('')}</div>
    <div class="legend">${parts.map(([k, l, m, c]) => `<span><i style="background:${c}"></i>${l} ${item[k]}/${m}</span>`).join('')}</div>`;
}
function reasonList(reasons) {
  return `<ul class="reasons">${reasons.map(r => `<li class="${r.points ? '' : 'zero'}"><span>${esc(r.label)}</span><span>${r.points ? '+' + r.points : '0'}</span></li>`).join('')}</ul>`;
}

function companyBlock(c, a) {
  if (!a) return '<div class="note">No company on the source page.</div>';
  const p = a.profile || {}, seg = { buyer: 'Potential buyer', partner: 'Partner', competitor: 'Competitor', vendor: 'Vendor', other: 'Other' }[p.segment] || 'Unknown';
  const others = a.contact_ids.filter(id => id !== c.id).map(id => S.contacts.find(x => x.id === id)).filter(Boolean).sort((x, y) => y.score - x.score);
  const apps = [...new Set(S.data.appearances.filter(x => x.account_id === a.id).map(x => `${S.events[x.event_id]?.short} (${x.tier || x.role})`))];
  return `<dl class="kv">
    <dt>Company</dt><dd><b>${esc(a.name)}</b>${p.domain ? ` · ${esc(p.domain)}` : ''}</dd>
    <dt>Type</dt><dd>${esc(seg)}${p.existing_customer ? ' · <b>existing GeneralMind customer</b>' : ''}${p.segment_reason ? ` <span style="color:var(--muted)">(${esc(p.segment_reason)})</span>` : ''}</dd>
    <dt>Industry</dt><dd>${esc(p.industry || '—')}${p.hq_country ? ` · ${esc(p.hq_country)}` : ''}${p.employees_band && p.employees_band !== 'unknown' ? ` · ${esc(p.employees_band)} employees` : ''}</dd>
    <dt>ERP</dt><dd>${esc(p.erp || 'unknown')}${p.erp_evidence ? ` <span style="color:var(--muted)">(${esc(p.erp_evidence)})</span>` : ''}</dd>
    ${apps.length ? `<dt>Exhibiting</dt><dd>${apps.map(esc).join(', ')}</dd>` : ''}
  </dl>
  ${others.length ? `<div style="margin-top:8px;font-size:13px"><b>Also from ${esc(a.name)}:</b></div><ul class="reasons">${others.map(o => `<li><span>${esc(o.name)} <small style="color:var(--muted)">${esc(o.title || '')} · ${esc(S.events[o.event_id]?.short)}</small></span><span>${o.score}</span></li>`).join('')}</ul>` : ''}
  <div class="note">Company details are estimates until an enrichment provider confirms them (confidence: ${esc(p.confidence || 'low')}).</div>`;
}

function decideBlock(c) {
  const st = statusOf(c), d = decisionOf('contact', c.id);
  const who = d ? `${d.reviewer ? ` by ${esc(d.reviewer)}` : ''}` : '';
  if (st === 'hubspot') {
    const u = hubspotUrl('contact', S.hs.get(hsKey(c)));
    return `<div class="note"><span class="status approve">In HubSpot</span>${who}. ${u ? `<a href="${esc(u)}" target="_blank" rel="noopener">Open in HubSpot ↗</a>` : ''} Changes from here on happen in HubSpot.
      ${S.data?.meta?.role === 'owner' ? '<div style="margin-top:8px"><button class="btn no" data-remove-hs style="font-size:12px;padding:3px 9px">Remove from HubSpot</button></div>' : ''}</div>`;
  }
  const status = st === 'approved' ? `<div class="note"><span class="status approve">Approved</span>${who} · waiting to be sent to HubSpot${hsLine(c)}</div>`
    : st === 'rejected' ? `<div class="note"><span class="status reject">Rejected</span>${d.reason ? `: ${esc(d.reason)}` : ''}${who}</div>` : '';
  const btns = st === 'review' ? `<button class="btn ok" data-act="approve">✓ Approve <span class="kbd">A</span></button><button class="btn no" data-act="reject">✕ Reject <span class="kbd">R</span></button>`
    : st === 'approved' ? `<button class="btn" data-act="clear">Unapprove</button><button class="btn no" data-act="reject">✕ Reject</button>`
    : `<button class="btn" data-act="clear">Restore to review</button><button class="btn ok" data-act="approve">✓ Approve</button>`;
  return `${status}<div class="decide">${btns}</div>
    <div class="reject-reasons" id="rr-contact">${REJECT_REASONS.map((r, i) => `<button data-reason="${esc(r)}"><span class="kbd">${i + 1}</span> ${esc(r)}</button>`).join('')}</div>`;
}

async function toggleSuppression(k, label, on) {
  const res = await fetch('api/suppression', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key: k, label, reason: on ? null : 'Asked not to be contacted', remove: !!on }) });
  if (!res.ok) return toast('Could not save');
  if (on) S.suppressed.delete(k); else S.suppressed.set(k, { key: k, label });
  toast(on ? 'Removed from do-not-contact' : 'On the do-not-contact list: never exported or sent to HubSpot');
  renderPeople();
}

function renderDrawer() {
  const c = S.contacts.find(x => x.id === S.sel), el = $('drawer');
  if (!c) { el.innerHTML = '<div class="empty">Select a person</div>'; return; }
  const a = S.accounts[c.account_id], ev = S.events[c.event_id], src = safeUrl(c.source_url), dnc = S.suppressed.has(c.person_key);
  el.innerHTML = `${closeBtn}
    <span class="chip lane lane-${c.lane}">${SUGGEST[c.lane]} · ${c.score}</span>
    <h2 style="margin-top:8px">${esc(c.name)}</h2>
    <div class="sub">${esc(c.title || 'No title listed')}<br><b style="color:var(--ink)">${esc(a?.name || c.company || '')}</b></div>
    ${c.brief ? `<div class="brief">${esc(c.brief)}${c.opener ? `<div class="op"><b>Opener:</b> ${esc(c.opener)}</div>` : ''}</div>` : ''}
    ${decideBlock(c)}

    ${c.also_at?.length ? `<div class="note">Also listed at ${c.also_at.map(e => esc(S.events[e]?.short || e)).join(', ')}. Do-not-contact and HubSpot treat these as one person.</div>` : ''}
    <h3>At the event</h3>
    <dl class="kv"><dt>Event</dt><dd>${esc(ev.name)}</dd><dt>When</dt><dd>${fmtDate(ev.start, ev.end)} · ${until(ev.start)}</dd><dt>Role</dt><dd>${esc(c.role_at_event || '—')}</dd>${c.session ? `<dt>Session</dt><dd>${esc(c.session)}</dd>` : ''}<dt>Source</dt><dd>${src ? `<a href="${esc(src)}" target="_blank" rel="noopener">Open source page ↗</a>` : '—'} <span style="color:var(--muted)">(${c.source_check === 'exact' ? 'name found on saved copy' : c.source_check === 'partial' ? 'name partly matched' : 'not found on saved copy'})</span></dd><dt>Edition</dt><dd>${esc(c.edition || '—')}</dd></dl>
    <h3>Why this score</h3>${breakdown(c)}<div style="height:8px"></div>${reasonList(c.reasons)}
    <h3>Data confidence: ${esc(c.confidence)}</h3>
    ${c.confidence_notes.length ? `<div class="note">${c.confidence_notes.map(esc).join('<br>')}</div>` : '<div class="note">Current edition, name found on the saved source page.</div>'}
    <h3>Company</h3>${companyBlock(c, a)}
    <div class="hint"><span class="kbd">J</span>/<span class="kbd">K</span> move · <span class="kbd">A</span> approve · <span class="kbd">R</span> then <span class="kbd">1</span>–<span class="kbd">6</span> reject · <span class="kbd">U</span> undo · <span class="kbd">O</span> open source</div>`;
  el.querySelector('[data-dnc]').onclick = () => toggleSuppression(c.person_key, c.name, dnc);
  el.querySelector('[data-remove-hs]')?.addEventListener('click', async () => {
    if (!confirm(S.hs.has(key('contact_linked', c.person_key)) ? `Remove ${c.name} from HubSpot? They were in HubSpot before the cockpit, so their record stays there. Here they go back to Approved.`
      : `Remove ${c.name} from HubSpot? Their record goes to HubSpot's recycle bin (restorable for 90 days), with their company if nobody else from it is there. Here they go back to Approved.`)) return;
    const r = await fetch('api/hubspot/remove', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contact_id: c.id }) });
    const out = await r.json().catch(() => ({}));
    toast(r.ok ? `${c.name} removed from HubSpot` : out.detail || 'Could not remove');
    if (r.ok) { S.status = 'approved'; S.hsFound = {}; await load(); }
  });
  wireCopy(el);
  el.querySelectorAll('[data-act]').forEach(b => b.onclick = () => b.dataset.act === 'reject' ? openReject() : decide('contact', c.id, b.dataset.act));
  el.querySelectorAll('[data-reason]').forEach(b => b.onclick = () => decide('contact', c.id, 'reject', b.dataset.reason));
  wireClose(el);
}

// ---------- decisions ----------
let rejectOpenFor = null;
function openReject() {
  const el = $('rr-contact');
  if (!el) return;
  el.classList.add('on'); rejectOpenFor = 'contact';
  el.scrollIntoView({ block: 'nearest' });
}

async function decide(type, id, decision, reason = null, fromUndo = false) {
  if (type === 'contact' && !S.reviewer && !store.get('reviewerAsked')) await askReviewer();
  const prev = decisionOf(type, id);
  rejectOpenFor = null;
  // pick the next person before this one leaves the current list
  let next = null;
  if (type === 'contact') { const rows = contactRows(), at = rows.findIndex(r => r.id === id); next = (rows[at + 1] || rows[at - 1])?.id; }
  const res = await fetch('api/decisions', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ object_type: type, object_id: id, decision, reason, reviewer: S.reviewer || null }) });
  if (!res.ok) { toast('Could not save. Try again.'); return; }
  const saved = await res.json();
  S.history.push(saved); applyDecision(saved);
  if (type === 'contact') delete S.hsFound[S.contacts.find(x => x.id === id)?.person_key];  // their listings changed: ask HubSpot again
  if (!fromUndo) S.undo.push({ type, id, prev });
  if (type === 'event') {
    toast(decision === 'approve' ? `Going: ${S.events[id].short}` : decision === 'reject' ? `Not going: ${S.events[id].short}` : 'Undecided');
    if (S.view === 'events') renderEvents(); else renderPeople();
  } else {
    toast(decision === 'approve' ? 'Approved' : decision === 'reject' ? `Rejected${reason ? ': ' + reason : ''}` : prev?.decision === 'approve' ? 'Back to review' : 'Restored to review');
    if (!fromUndo && next) S.sel = next;
    if (S.view === 'events') renderEventPage();
    renderPeople();
  }
  renderExport();
}

async function undo() {
  const last = S.undo.pop();
  if (!last) return toast('Nothing to undo');
  if (last.type === 'contact') {
    const c = S.contacts.find(x => x.id === last.id);
    if (c && statusOf(c) === 'hubspot') return toast(`${c.name} is already in HubSpot: change it there`);
  }
  if (last.type === 'contact') S.sel = last.id;
  await decide(last.type, last.id, last.prev ? last.prev.decision : 'clear', last.prev?.reason, true);
}

function moveSel(step) {
  rejectOpenFor = null;
  const rows = contactRows(), i = rows.findIndex(r => r.id === S.sel);
  const next = rows[Math.max(0, Math.min(rows.length - 1, i + step))];
  if (next) S.sel = next.id;
}

function askReviewer() {
  return new Promise(resolve => {
    const dlg = $('whoDlg'); $('whoInput').value = S.reviewer;
    dlg.onclose = () => {
      store.set('reviewerAsked', '1');
